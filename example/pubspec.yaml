name: pdf_manipulator_example
description: Example app demonstrating pdf_manipulator features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  pdf_manipulator:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webdriver: ^3.0.0
  # UI-test harness + robots, shared by test/ and integration_test/
  # through a package: import (no cross-root ../ paths).
  pdf_manipulator_example_test_support:
    path: test_support

flutter:
  uses-material-design: true
  assets:
    # Noto Emoji (OFL) — the Fill-with-emoji card registers it as the
    # engine's emoji fallback font. See assets/fonts/LICENSE-NotoEmoji.
    - assets/fonts/NotoEmoji-Regular.ttf
