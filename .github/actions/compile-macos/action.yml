name: Compile macOS
description: Build pdf_oxide for macOS arm64 + x64

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - uses: dtolnay/rust-toolchain@stable
      with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    - uses: Swatinem/rust-cache@v2
      with: { workspaces: vendor/pdf_oxide }
    - shell: bash
      env:
        MANIFEST: vendor/pdf_oxide/Cargo.toml
        FEATURES: icc,legacy-crypto,rendering,signatures
      run: |
        for t in aarch64-apple-darwin x86_64-apple-darwin; do
          cargo build --manifest-path $MANIFEST --lib --release --target $t --features $FEATURES
        done
        mkdir -p out/macos-arm64 out/macos-x64
        cp vendor/pdf_oxide/target/aarch64-apple-darwin/release/libpdf_oxide.dylib out/macos-arm64/
        cp vendor/pdf_oxide/target/x86_64-apple-darwin/release/libpdf_oxide.dylib out/macos-x64/
