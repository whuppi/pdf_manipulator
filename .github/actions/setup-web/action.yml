name: Setup Web
description: >
  Chrome + ChromeDriver (matched), binaryen, xvfb, WASM build cache.
  FVM and Rust come from flutter-target — not duplicated here.
  Linux CI only.

runs:
  using: composite
  steps:
    # ── Chrome + ChromeDriver (matched, from Chrome for Testing API) ──
    - shell: bash
      run: |
        set -euo pipefail

        API="https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
        JSON=$(curl -sS "$API")

        # Parse with grep/sed — no python3, no jq
        VERSION=$(echo "$JSON" | grep -oE '"Stable":\{[^}]*"version":"[^"]*"' | grep -oE '"version":"[^"]*"' | head -1 | sed 's/"version":"//;s/"//')
        CHROME_URL=$(echo "$JSON" | grep -oE '"url":"https://[^"]*chrome-linux64\.zip"' | head -1 | sed 's/"url":"//;s/"//')
        DRIVER_URL=$(echo "$JSON" | grep -oE '"url":"https://[^"]*chromedriver-linux64\.zip"' | head -1 | sed 's/"url":"//;s/"//')
        echo "Chrome for Testing: $VERSION"

        INSTALL_DIR="/opt/chrome-for-testing"
        sudo mkdir -p "$INSTALL_DIR"

        echo "=== Installing Chrome ==="
        curl -sSL "$CHROME_URL" -o /tmp/chrome.zip
        sudo unzip -qo /tmp/chrome.zip -d "$INSTALL_DIR"
        rm /tmp/chrome.zip
        CHROME_BIN="$INSTALL_DIR/chrome-linux64/chrome"
        sudo chmod +x "$CHROME_BIN"

        echo "=== Installing ChromeDriver ==="
        curl -sSL "$DRIVER_URL" -o /tmp/chromedriver.zip
        sudo unzip -qo /tmp/chromedriver.zip -d "$INSTALL_DIR"
        rm /tmp/chromedriver.zip
        CHROMEDRIVER_BIN="$INSTALL_DIR/chromedriver-linux64/chromedriver"
        sudo chmod +x "$CHROMEDRIVER_BIN"

        sudo apt-get remove -y google-chrome-stable 2>/dev/null || true
        sudo dpkg --purge google-chrome-stable 2>/dev/null || true

        sudo ln -sf "$CHROME_BIN" /usr/bin/google-chrome-stable
        sudo ln -sf "$CHROME_BIN" /usr/bin/google-chrome
        sudo mkdir -p /opt/google/chrome
        sudo ln -sf "$CHROME_BIN" /opt/google/chrome/chrome
        sudo ln -sf "$CHROMEDRIVER_BIN" /usr/local/bin/chromedriver

        echo "Chrome: $(google-chrome-stable --version)"
        echo "ChromeDriver: $(chromedriver --version)"

    # ── WASM toolchain ──
    - shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq binaryen xvfb

    # ── WASM build cache ──
    - name: Cache WASM build output
      uses: actions/cache@v4
      id: wasm-cache
      with:
        path: web_assets/pdf_oxide_bg.wasm
        key: wasm-${{ env.SUBMODULE_PDF_OXIDE }}

    - name: Build WASM
      if: steps.wasm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make build-wasm
