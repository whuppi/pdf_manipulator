name: Dart Test
description: Checkout, setup Dart + Rust, compile from source, run dart test

inputs:
  rust-targets:
    description: Extra Rust targets to install (comma-separated)
    required: false
    default: ''

runs:
  using: composite
  steps:

    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - uses: dtolnay/rust-toolchain@stable
      if: inputs.rust-targets == ''

    - uses: dtolnay/rust-toolchain@stable
      if: inputs.rust-targets != ''
      with:
        targets: ${{ inputs.rust-targets }}

    - uses: mozilla-actions/sccache-action@v0.0.10

    - shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV

    - run: dart pub get --no-example
      shell: bash

    - run: dart test --timeout=120s
      shell: bash
