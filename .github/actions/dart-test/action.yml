name: Dart Test
description: Checkout, setup Dart + Rust, compile from source, run dart test

inputs:
  rust-targets:
    description: Extra Rust targets to install (comma-separated)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - uses: dtolnay/rust-toolchain@stable
      if: inputs.rust-targets == ''

    - uses: dtolnay/rust-toolchain@stable
      if: inputs.rust-targets != ''
      with:
        targets: ${{ inputs.rust-targets }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: vendor/pdf_oxide

    - run: dart pub get --no-example
      shell: bash

    - run: dart test --timeout=120s
      shell: bash
