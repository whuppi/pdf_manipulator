name: Dart Test
description: Setup Flutter + Rust from config.json, compile from source, run dart test.

inputs:
  rust-targets:
    description: Extra Rust targets to install (comma-separated)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: ./.github/workflows/actions/load_config
      id: config

    - uses: ./.github/workflows/actions/setup_flutter
      with:
        flutter_channel: ${{ steps.config.outputs.flutter_channel }}

    - uses: ./.github/workflows/actions/setup_rust
      with:
        rust_version: ${{ steps.config.outputs.rust_version }}

    - uses: mozilla-actions/sccache-action@v0.0.10

    - shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV

    - run: dart test --timeout=120s
      shell: bash
