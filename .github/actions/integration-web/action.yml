name: Integration Test (Web)
description: Run example Flutter integration test on all 3 web modes via Makefile

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-fvm
    - uses: ./.github/actions/setup-rust
      with: { targets: wasm32-unknown-unknown }
    - uses: browser-actions/setup-chrome@v1
      with:
        install-chromedriver: true
    - shell: bash
      run: |
        cargo install wasm-bindgen-cli --version 0.2.121
        sudo apt-get update && sudo apt-get install -y binaryen xvfb
    - shell: bash
      run: make build-wasm
    - shell: bash
      run: xvfb-run make test-example-web
