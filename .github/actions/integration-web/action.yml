name: Integration Test (Web)
description: Run example Flutter integration test on all 3 web modes via Makefile

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-web-testing
      id: web
    - shell: bash
      env:
        CHROME_PATH: ${{ steps.web.outputs.chrome-path }}
      run: xvfb-run make test-example-web
