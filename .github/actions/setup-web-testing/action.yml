name: Setup Web Testing (Linux only)
description: >
  Install Chrome + ChromeDriver (matched versions), FVM, Rust (wasm target),
  wasm-bindgen, binaryen, xvfb. Build WASM. Linux CI only — web tests always
  run on ubuntu-latest.

outputs:
  chrome-path:
    description: Path to the installed Chrome binary
    value: ${{ steps.chrome.outputs.chrome-path }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-fvm
    - uses: ./.github/actions/setup-rust
      with: { targets: wasm32-unknown-unknown }
    - uses: browser-actions/setup-chrome@v2
      id: chrome
      with:
        install-chromedriver: true
    - shell: bash
      run: |
        cargo install wasm-bindgen-cli --version 0.2.121
        sudo apt-get update && sudo apt-get install -y binaryen xvfb
    - shell: bash
      run: make build-wasm
    - shell: bash
      run: |
        # Remove system Chrome so chromedriver only finds the action's matched version.
        # flutter drive's WebDriverService creates its own chromedriver session that
        # ignores CHROME_EXECUTABLE and uses whatever chrome is on PATH / at the default
        # location. Without this, chromedriver 149 finds system Chrome 148 → mismatch.
        sudo rm -f /usr/bin/google-chrome-stable /usr/bin/google-chrome /opt/google/chrome/chrome 2>/dev/null || true
        # Symlink the action's Chrome to where chromedriver expects it
        sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /usr/bin/google-chrome-stable
        sudo ln -sf "${{ steps.chrome.outputs.chrome-path }}" /usr/bin/google-chrome
        echo "Chrome: $(google-chrome-stable --version)"
        echo "ChromeDriver: $(chromedriver --version)"
