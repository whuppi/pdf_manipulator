name: Setup Web Testing (Linux only)
description: >
  Install Chrome + ChromeDriver (matched versions), FVM, Rust (wasm target),
  wasm-bindgen, binaryen, xvfb. Build WASM. Linux CI only — web tests always
  run on ubuntu-latest.

outputs:
  chrome-path:
    description: Path to the installed Chrome binary
    value: ${{ steps.chrome.outputs.chrome-path }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-fvm
    - uses: ./.github/actions/setup-rust
      with: { targets: wasm32-unknown-unknown }
    - uses: browser-actions/setup-chrome@v2
      id: chrome
      with:
        install-chromedriver: true
    - shell: bash
      run: |
        cargo install wasm-bindgen-cli --version 0.2.121
        sudo apt-get update && sudo apt-get install -y binaryen xvfb
    - shell: bash
      run: make build-wasm
    - shell: bash
      env:
        CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        # Replace system Chrome with the action's matched version everywhere.
        # Chrome for Testing (from setup-chrome@v2) needs --no-sandbox on CI.
        # Setting CHROME_EXECUTABLE makes both `dart test -p chrome` and
        # `flutter drive` use our wrapper which adds --no-sandbox + SAB.
        sudo rm -f /usr/bin/google-chrome-stable /usr/bin/google-chrome /opt/google/chrome/chrome 2>/dev/null || true
        sudo ln -sf "$CHROME_PATH" /usr/bin/google-chrome-stable
        sudo ln -sf "$CHROME_PATH" /usr/bin/google-chrome
        # Set CHROME_EXECUTABLE globally for all subsequent steps
        WRAPPER="$(cd "$GITHUB_WORKSPACE" && pwd)/tool/chrome_with_sab.sh"
        echo "CHROME_EXECUTABLE=$WRAPPER" >> $GITHUB_ENV
        echo "CHROME_PATH=$CHROME_PATH" >> $GITHUB_ENV
        echo "Chrome: $(google-chrome-stable --version)"
        echo "ChromeDriver: $(chromedriver --version)"
