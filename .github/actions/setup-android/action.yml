name: Setup Android
description: Java + Gradle cache. Optionally boot emulator for integration tests.

inputs:
  java-version:
    description: "JDK version"
    required: false
    default: '17'
  emulator:
    description: "Boot emulator and run script inside it"
    required: false
    default: 'false'
  emulator-script:
    description: "Command to run inside the emulator context"
    required: false
    default: ''
  api-level:
    description: "Android API level for emulator"
    required: false
    default: '34'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('example/android/build.gradle.kts', 'example/android/app/build.gradle.kts') }}
        restore-keys: gradle-

    - name: Enable KVM
      if: inputs.emulator == 'true'
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Boot emulator + run
      if: inputs.emulator == 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        arch: x86_64
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: ${{ inputs.emulator-script }}
