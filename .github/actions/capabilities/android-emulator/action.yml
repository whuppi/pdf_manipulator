name: Android Emulator
description: >
  Boot Android emulator and run a script inside it.

  Target: aosp_atd (Automated Test Device) — stripped-down image
  built for CI. No Google Play, minimal UI, fast boot. Lightest
  available image. Weight hierarchy:
    google_apis_playstore > google_apis > default > aosp_atd

  Arch: x86_64 on all runners. Linux uses KVM. macOS Intel uses
  HAXM/HVF. Windows uses WHPX.

  Linux/macOS use reactivecircus/android-emulator-runner. Windows
  uses a manual boot script (the action doesn't support Windows).

  macOS ARM runners (M1) cannot run emulators — nested
  virtualization unsupported on M1 hardware.
  https://docs.github.com/en/actions/reference/runners/github-hosted-runners#limitations-for-arm64-macos-runners

inputs:
  script:
    description: "Command to run while emulator is alive"
    required: true
  api-level:
    description: "Android API level (30 is lightest ATD available)"
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: Start adb server
      shell: bash
      run: |
        $ANDROID_HOME/platform-tools/adb start-server
        $ANDROID_HOME/platform-tools/adb devices

    # Watchdog for the flutter test teardown hang on macOS Intel.
    #
    # Only affects: macOS Intel + SwiftShader (no hardware GPU).
    # Does NOT affect: Linux with KVM, Windows, macOS ARM, local dev.
    #
    # Root cause: Flutter's stopApp() calls `adb shell am force-stop`
    # with no timeout (android_device.dart → _processUtils.stream()).
    # On SwiftShader emulators, qemu uses ~200% CPU on 4 cores,
    # starving the guest's ActivityManagerService. The `am force-stop`
    # command never gets CPU time to execute. The dartvm waits for
    # this adb child forever → flutter test never exits.
    #
    # Fix: detect the stuck adb child of dartvm (0% CPU) and kill it.
    # stopApp() receives an error, continues teardown, flutter test
    # prints the summary and exits cleanly.
    #
    # Harmless on runners where the hang doesn't occur — the watchdog
    # simply never finds a stuck adb process and exits with the
    # user's command.
    - name: Write emulator scripts
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cat > /tmp/emulator-run.sh << 'EMUSCRIPT'
        #!/usr/bin/env bash
        set -euo pipefail

        # Run the user's command in background.
        bash -c "$1" &
        CMD_PID=$!

        # Watchdog: detect and kill stuck `adb shell am force-stop`.
        (
          KILLED=false
          while kill -0 $CMD_PID 2>/dev/null; do
            sleep 30
            # Walk every dartvm's children looking for a stuck adb.
            for dvmpid in $(pgrep -f dartvm 2>/dev/null); do
              for cpid in $(pgrep -P "$dvmpid" 2>/dev/null); do
                CNAME=$(ps -p "$cpid" -o comm= 2>/dev/null || true)
                CCPU=$(ps -p "$cpid" -o %cpu= 2>/dev/null | tr -d ' ' || true)
                if echo "$CNAME" | grep -q adb && [ "$KILLED" = "false" ]; then
                  # adb child of dartvm at 0% CPU = stuck stopApp().
                  # Float compare: 0.0% or less = stuck.
                  if echo "$CCPU" | awk '{ exit ($1 > 0.1) }'; then
                    echo ""
                    echo "=== WATCHDOG: stuck adb detected (PID $cpid, child of dartvm $dvmpid, cpu=${CCPU}%) ==="
                    echo "    Flutter stopApp() has no timeout — killing to unblock teardown."
                    echo "    Only happens on macOS Intel (SwiftShader CPU starvation)."
                    kill -9 "$cpid" 2>/dev/null || true
                    KILLED=true
                    echo "=== WATCHDOG: killed. Flutter test should exit shortly. ==="
                    echo ""
                  fi
                fi
              done
            done
          done
        ) &
        WATCHDOG_PID=$!

        # Wait for the user's command to finish.
        wait $CMD_PID 2>/dev/null
        EXIT=$?

        # Stop the watchdog.
        kill $WATCHDOG_PID 2>/dev/null || true
        wait $WATCHDOG_PID 2>/dev/null || true

        exit $EXIT
        EMUSCRIPT
        chmod +x /tmp/emulator-run.sh

    # ── Linux / macOS — use the action ──
    - name: Emulator (Linux/macOS)
      if: runner.os != 'Windows'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        arch: x86_64
        target: aosp_atd
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim
        emulator-boot-timeout: 600
        disable-animations: true
        script: /tmp/emulator-run.sh '${{ inputs.script }}'

    # ── Windows — manual boot (action doesn't support Windows) ──
    # Git Bash needs Unix paths — cygpath converts C:\Android\... to /c/Android/...
    - name: Install system image (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        SDK="$(cygpath "$ANDROID_HOME")"
        SDKMGR="$(find "$SDK/cmdline-tools" -name "sdkmanager*" -type f | head -1)"
        echo "sdkmanager: $SDKMGR"
        yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
        "$SDKMGR" \
          "system-images;android-${{ inputs.api-level }};aosp_atd;x86_64" \
          "platform-tools" \
          "emulator" > /dev/null

    - name: Create AVD (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        SDK="$(cygpath "$ANDROID_HOME")"
        AVDMGR="$(find "$SDK/cmdline-tools" -name "avdmanager*" -type f | head -1)"
        echo no | "$AVDMGR" create avd \
          --force -n test \
          --package "system-images;android-${{ inputs.api-level }};aosp_atd;x86_64"

    - name: Boot emulator (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        SDK="$(cygpath "$ANDROID_HOME")"
        "$SDK/emulator/emulator" -port 5554 -avd test \
          -no-snapshot-save -no-window -noaudio -no-boot-anim &

        echo "Waiting for emulator to boot..."
        TIMEOUT=600
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          RESULT=$("$SDK/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null || true)
          if [ "$RESULT" = "1" ]; then
            echo "Emulator booted in ${ELAPSED}s."
            break
          fi
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done

        if [ "$RESULT" != "1" ]; then
          echo "::error::Emulator failed to boot within ${TIMEOUT}s"
          exit 1
        fi

        "$SDK/platform-tools/adb" -s emulator-5554 shell input keyevent 82
        "$SDK/platform-tools/adb" -s emulator-5554 shell settings put global window_animation_scale 0.0
        "$SDK/platform-tools/adb" -s emulator-5554 shell settings put global transition_animation_scale 0.0
        "$SDK/platform-tools/adb" -s emulator-5554 shell settings put global animator_duration_scale 0.0

    - name: Run script (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: ${{ inputs.script }}

    - name: Kill emulator (Windows)
      if: always() && runner.os == 'Windows'
      shell: bash
      run: |
        SDK="$(cygpath "$ANDROID_HOME")"
        "$SDK/platform-tools/adb" -s emulator-5554 emu kill || true
