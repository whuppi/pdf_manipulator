name: Android Emulator
description: >
  Boot Android emulator and run a script inside it.
  Uses x86_64 arch on all runners. Linux: KVM accelerated.
  macOS: HAXM/HVF on Intel runners only — ARM runners do NOT
  support nested virtualization (M1 hardware limitation).
  See ReactiveCircus/android-emulator-runner#350.

inputs:
  script:
    description: "Command to run while emulator is alive"
    required: true
  api-level:
    description: "Android API level"
    required: false
    default: '35'

runs:
  using: composite
  steps:
    - name: Start adb server
      shell: bash
      run: |
        $ANDROID_HOME/platform-tools/adb start-server
        $ANDROID_HOME/platform-tools/adb devices

    - uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ inputs.api-level }}
        arch: x86_64
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
        disable-animations: true
        script: ${{ inputs.script }}
