name: Rust
description: Install Rust toolchain + sccache for fast builds

inputs:
  targets:
    description: Extra Rust targets (comma-separated)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Submodule cache key
      id: sub
      shell: bash
      run: |
        echo "pdf_oxide=$(git rev-parse HEAD:vendor/pdf_oxide)" >> $GITHUB_OUTPUT
        echo "office_oxide=$(git rev-parse HEAD:vendor/office_oxide)" >> $GITHUB_OUTPUT

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.sub.outputs.pdf_oxide }}-${{ steps.sub.outputs.office_oxide }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
    - uses: mozilla-actions/sccache-action@v0.0.10
    - shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
        echo "SUBMODULE_PDF_OXIDE=${{ steps.sub.outputs.pdf_oxide }}" >> $GITHUB_ENV
        echo "SUBMODULE_OFFICE_OXIDE=${{ steps.sub.outputs.office_oxide }}" >> $GITHUB_ENV

    # sccache for build hooks (dart-lang/native#3396 workaround).
    #
    # hooks_runner strips SCCACHE_* and RUSTC_WRAPPER env vars before
    # spawning build.dart. Two workarounds keep sccache working:
    #
    # 1. Pre-start the server with SCCACHE_IDLE_TIMEOUT=0 while GHA
    #    env vars exist. The server reads config at startup and persists.
    #    Default idle timeout (600s) is too short — the 25+ min gap
    #    (SDK download + emulator boot + Gradle) kills the server.
    #
    # 2. Write rustc-wrapper to $CARGO_HOME/config.toml. Cargo reads
    #    this file automatically. hooks_runner can't strip a file.
    #    HOME is in the allowlist, so cargo finds ~/.cargo/config.toml.
    - name: Configure sccache for build hooks
      shell: bash
      run: |
        export SCCACHE_IDLE_TIMEOUT=0
        sccache --start-server || true

        SCCACHE_BIN="$(which sccache)"
        mkdir -p "$HOME/.cargo"
        cat >> "$HOME/.cargo/config.toml" << EOF

        [build]
        rustc-wrapper = "$SCCACHE_BIN"
        EOF
        echo "sccache: server started, cargo config written ($SCCACHE_BIN)"
