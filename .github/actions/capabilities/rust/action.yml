name: Rust
description: Install Rust toolchain + sccache for fast builds

inputs:
  targets:
    description: Extra Rust targets (comma-separated)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Submodule cache key
      id: sub
      shell: bash
      run: |
        echo "pdf_oxide=$(git rev-parse HEAD:vendor/pdf_oxide)" >> "$GITHUB_OUTPUT"
        echo "office_oxide=$(git rev-parse HEAD:vendor/office_oxide)" >> "$GITHUB_OUTPUT"

    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.sub.outputs.pdf_oxide }}-${{ steps.sub.outputs.office_oxide }}
        restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

    # Drive the runner's pre-installed rustup directly. Do not swap in
    # dtolnay/rust-toolchain: it ships no version tags, so it can only be
    # pinned to a rolling master SHA.
    - name: Install Rust toolchain
      id: toolchain
      shell: bash
      env:
        INPUTS_TARGETS: ${{ inputs.targets }}
      run: |
        # RUST_VERSION is the single pin in tool/versions.env — install
        # exactly it (a rolling `stable` would make CI non-reproducible and
        # never test the engine's declared MSRV).
        source tool/versions.env
        rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
        rustup default "$RUST_VERSION"
        # targets input is comma- or space-separated; empty → no extra targets
        for t in $(tr ',' ' ' <<< "$INPUTS_TARGETS"); do
          rustup target add "$t"
        done
        rustc --version
        # Hoist the sccache pin for the action step below — a composite
        # action's `with:` cannot source a file, so the pin crosses as an
        # output. versions.env explains why it is pinned.
        echo "sccache=$SCCACHE_VERSION" >> "$GITHUB_OUTPUT"
    # `version:` MUST stay. Without it the action installs whatever sccache
    # released last, and versions.env's SCCACHE_VERSION comment documents what
    # that has cost. Bump the pin there, never here.
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v${{ steps.toolchain.outputs.sccache }}
    - shell: bash
      env:
        STEPS_SUB_OUTPUTS_PDF_OXIDE: ${{ steps.sub.outputs.pdf_oxide }}
        STEPS_SUB_OUTPUTS_OFFICE_OXIDE: ${{ steps.sub.outputs.office_oxide }}
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          # The cache namespace is chosen HERE, deliberately, instead of by
          # whatever the sccache binary derives. Bump the number to purge every
          # cached object on purpose (a poisoned or bloated cache); leave it
          # alone across sccache and toolchain bumps — rustc's own hash is
          # already part of every object key, so a toolchain bump never
          # serves a stale object.
          echo "SCCACHE_GHA_VERSION=1"
          echo "RUSTC_WRAPPER=sccache"
          # Incremental artifacts are useless on a fresh runner and make
          # sccache refuse to cache the crate. Keep this 0 in CI.
          echo "CARGO_INCREMENTAL=0"
          # crates.io fetches occasionally drop mid-transfer on CI (curl 56,
          # connection reset). cargo's default is 3 retries; 10 rides out a
          # short registry blip instead of failing the whole build.
          echo "CARGO_NET_RETRY=10"
          # HTTP/2 multiplexing intermittently fails crates.io with a framing
          # layer error (curl 16) that the retry above doesn't catch; HTTP/1.1
          # avoids that class.
          echo "CARGO_HTTP_MULTIPLEXING=false"
        } >> "$GITHUB_ENV"
        # Submodule pins arrive via env (hoisted from step outputs). Heredoc
        # with a random delimiter so a stray newline can't inject entries.
        {
          echo "SUBMODULE_PDF_OXIDE<<__SUB_PDF__"
          echo "${STEPS_SUB_OUTPUTS_PDF_OXIDE}"
          echo "__SUB_PDF__"
          echo "SUBMODULE_OFFICE_OXIDE<<__SUB_OFFICE__"
          echo "${STEPS_SUB_OUTPUTS_OFFICE_OXIDE}"
          echo "__SUB_OFFICE__"
        } >> "$GITHUB_ENV"

    # sccache for build hooks (dart-lang/native#3396 workaround).
    #
    # hooks_runner strips SCCACHE_* and RUSTC_WRAPPER env vars before
    # spawning build.dart. Two workarounds keep sccache working:
    #
    # 1. Pre-start the server with SCCACHE_IDLE_TIMEOUT=0 while GHA
    #    env vars exist. The server reads config at startup and persists.
    #    Default idle timeout (600s) is too short — the 25+ min gap
    #    (SDK download + emulator boot + Gradle) kills the server.
    #
    # 2. Write rustc-wrapper to $CARGO_HOME/config.toml. Cargo reads
    #    this file automatically. hooks_runner can't strip a file.
    #    HOME is in the allowlist, so cargo finds ~/.cargo/config.toml.
    - name: Configure sccache for build hooks
      shell: bash
      run: |
        export SCCACHE_IDLE_TIMEOUT=0
        sccache --start-server || true

        SCCACHE_BIN="$(which sccache)"
        # Cargo on Windows needs a drive-letter path, not Git Bash /c/...
        # Use cygpath -m for forward-slash Windows path (C:/...) which
        # works in TOML without escaping backslashes.
        if command -v cygpath &>/dev/null; then
          SCCACHE_BIN="$(cygpath -m "$SCCACHE_BIN")"
        fi
        mkdir -p "$HOME/.cargo"
        CFG="$HOME/.cargo/config.toml"
        # Insert under [build] (a second header is a TOML error) with awk, not a
        # GNU one-line sed append; that form broke on macOS. Pass the path via
        # ENVIRON, not awk -v, which would interpret a backslash in it.
        if [ -f "$CFG" ] && grep -q '^\[build\]' "$CFG"; then
          sk_w="$SCCACHE_BIN" awk '
            BEGIN { w = ENVIRON["sk_w"] }
            { print }
            /^\[build\]/ && !seen { print "rustc-wrapper = \"" w "\""; seen=1 }
          ' "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG" || rm -f "$CFG.tmp"
        else
          printf '\n[build]\nrustc-wrapper = "%s"\n' "$SCCACHE_BIN" >> "$CFG"
        fi
        echo "sccache: server started, cargo config written ($SCCACHE_BIN)"
