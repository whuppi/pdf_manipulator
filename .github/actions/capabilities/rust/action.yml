name: Rust
description: >
  Install the pinned Rust toolchain, point every cargo build path at ONE
  target directory, and cache that directory + the cargo registry with
  rust-cache.

  Why the target directory is the thing cached (and not per-object
  compiler output): the engine's final artifact is a cdylib built with fat
  LTO, and no wrapper cache (sccache, ccache) can cache a crate that
  invokes the system linker — so with a 100 % wrapper hit rate the
  expensive step still ran every job. cargo's own fingerprint in target/
  is the only thing that reuses it, and that only survives if target/ does.

inputs:
  targets:
    description: Extra Rust targets (comma-separated)
    required: false
    default: ''
  cache:
    description: >
      Restore/save the cargo target dir + registry. Pass 'false' for a
      deliberately COLD build — the release compile jobs and the scheduled
      cold Full Test — which is the only proof that a fresh clone still
      builds from source. Never default this to false to "simplify".
    required: false
    default: 'true'
  cache-key:
    description: >
      Extra key segment that separates caches whose target/ contents
      differ (the make target: each builds different triples / features).
      rust-cache adds rustc host+version, the Cargo.lock/toml hashes, and
      the CARGO/RUST env on its own.
    required: false
    default: ''
  save-if:
    description: >
      Whether this run may WRITE the cache. GitHub scopes caches to the
      branch that wrote them and lets a PR read only its base and the
      default branch, so caches written from PR refs are invisible to every
      other PR and only burn the 10 GB quota. Callers pass 'true' from
      `dev` (the warm source everyone reads) and on a primary-key miss.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Submodule cache key
      id: sub
      shell: bash
      run: |
        echo "pdf_oxide=$(git rev-parse HEAD:vendor/pdf_oxide)" >> "$GITHUB_OUTPUT"
        echo "office_oxide=$(git rev-parse HEAD:vendor/office_oxide)" >> "$GITHUB_OUTPUT"

    # Drive the runner's pre-installed rustup directly. Do not swap in
    # dtolnay/rust-toolchain: it ships no version tags, so it can only be
    # pinned to a rolling master SHA.
    - name: Install Rust toolchain
      shell: bash
      env:
        INPUTS_TARGETS: ${{ inputs.targets }}
      run: |
        # RUST_VERSION is the single pin in tool/versions.env — install
        # exactly it (a rolling `stable` would make CI non-reproducible and
        # never test the engine's declared MSRV).
        source tool/versions.env
        rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
        rustup default "$RUST_VERSION"
        # targets input is comma- or space-separated; empty → no extra targets
        for t in $(tr ',' ' ' <<< "$INPUTS_TARGETS"); do
          rustup target add "$t"
        done
        rustc --version

    # ONE cargo target dir for every build path in the job: the consumer
    # hook (dart test, flutter build inside Gradle / Xcode), tool/compile.dart
    # (the release cross-compiler) and `cargo test` all land in
    # vendor/pdf_oxide/target. Same triple + profile + features = same
    # artifact, reused; and rust-cache below persists that one tree.
    #
    # The hook cannot take this from an env var: hooks_runner strips the
    # environment to a fixed allowlist before spawning it (the same wall
    # the old sccache wiring had to work around). HOME survives, so the
    # override is a file under it — see hookCargoTargetDir() in
    # lib/src/hook/engine_compiler.dart, which also explains why the
    # default stays inside .dart_tool for consumers.
    - name: One cargo target dir for every build path
      shell: bash
      run: |
        mkdir -p "$HOME/.pdf_manipulator"
        printf '%s\n' "$GITHUB_WORKSPACE/vendor/pdf_oxide/target" \
          > "$HOME/.pdf_manipulator/cargo-target-dir"
        echo "cargo target dir: $GITHUB_WORKSPACE/vendor/pdf_oxide/target"

    # rust-cache caches ~/.cargo (registry, git deps) and the workspace
    # target dirs as ONE archive per key, cleaned of incremental + unused
    # artifacts before save. Why these settings — each one is load-bearing:
    #   workspaces             both vendored crates; office_oxide is built
    #                          into pdf_oxide's target when the `office`
    #                          feature is on, and on its own for its tests.
    #   cache-workspace-crates rust-cache's default DROPS the workspace's
    #                          own crates before saving, keeping only deps.
    #                          Our "workspace crate" IS the vendored engine,
    #                          which changes only on a fork bump — and its
    #                          fat-LTO cdylib is the whole point of caching.
    #   key                    the make target (rows building different
    #                          triples / features must not share a key)
    #                          AND both vendored submodule revs. The revs
    #                          are what make the mtime pin below safe —
    #                          see that step. Never drop them from the key.
    #   cache-on-failure       a red row still saves the deps it built, so
    #                          the fix-up push is warm.
    #   save-if                see the input; PR refs mostly read.
    # Stale-artifact safety: the key carries the rustc version, every
    # Cargo.lock/Cargo.toml hash and the exact vendor revs; rust-cache
    # prunes artifacts older than seven days at save time, so a warm cache
    # cannot drift more than a week from a from-scratch build, and the
    # scheduled cold Full Test proves from-scratch on top of that.
    #   prefix-key             rust-cache saves ONLY on a primary-key miss;
    #                          an archive that exists is never re-saved,
    #                          even when a run rebuilt everything under
    #                          it. So any change to how artifacts are
    #                          produced or fingerprinted (the mtime-pin
    #                          rule below, the target-dir layout, the
    #                          cleanup settings) MUST bump this prefix, or
    #                          every existing key keeps serving an archive
    #                          the new rule can't hit. Bump = one integer.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.cache == 'true'
      with:
        prefix-key: v1-rust
        workspaces: |
          vendor/pdf_oxide -> target
          vendor/office_oxide -> target
        key: ${{ inputs.cache-key }}-${{ steps.sub.outputs.pdf_oxide }}-${{ steps.sub.outputs.office_oxide }}
        cache-workspace-crates: true
        cache-on-failure: true
        save-if: ${{ inputs.save-if }}

    # cargo fingerprints a PATH crate (the vendored engine — unlike a
    # registry crate, which is fingerprinted by content) by its sources'
    # mtimes, two ways, and both must agree between the run that saved the
    # cache and the run that restores it:
    #   1. every source must be OLDER than the cached dep-info, and
    #   2. the package fingerprint records "the newest file's mtime AND its
    #      path" and compares that string for equality
    #      (PrecalculatedComponentsChanged in cargo's fingerprint log).
    # A checkout stamps every file "now", so (1) fails on every run and the
    # engine recompiles while the cache only serves dependencies. Pinning
    # all of vendor/ to one past instant fixes (1) but breaks (2): with
    # every mtime equal, which file counts as "newest" is decided by
    # directory-walk order, which differs between runner VMs. So after the
    # pin, each package's Cargo.toml is bumped one day later — one file,
    # deterministically the newest — and both runs record the same string.
    #
    # This is ONLY correct because the cache key names the exact vendor
    # revs: same key ⇒ byte-identical sources ⇒ reusing the artifact is
    # right; any source change ⇒ new rev ⇒ new key ⇒ cold build. It was
    # measured, not assumed: with the pin in place cargo does NOT notice an
    # edited source file (its mtime is older than the cached dep-info), so
    # the revs in the key are the ONLY thing standing between this step and
    # a stale binary. Remove them and it serves one. Never widen the touch
    # to anything outside vendor/, and never run it on a developer machine —
    # local builds rely on real mtimes.
    - name: Pin vendor source mtimes for cargo freshness
      if: inputs.cache == 'true'
      shell: bash
      run: |
        find vendor -type f -not -path '*/target/*' -exec touch -t 200001010000 {} +
        find vendor -name Cargo.toml -not -path '*/target/*' -exec touch -t 200001020000 {} +
        echo "vendor mtimes pinned (Cargo.toml newest)"

    - shell: bash
      env:
        STEPS_SUB_OUTPUTS_PDF_OXIDE: ${{ steps.sub.outputs.pdf_oxide }}
        STEPS_SUB_OUTPUTS_OFFICE_OXIDE: ${{ steps.sub.outputs.office_oxide }}
      run: |
        {
          # Incremental artifacts are useless on a fresh runner, bloat the
          # cache, and rust-cache strips them anyway. Keep this 0 in CI.
          echo "CARGO_INCREMENTAL=0"
          # PROBE (temporary): print why cargo considers a unit dirty.
          echo "CARGO_LOG=cargo::core::compiler::fingerprint=info"
          # crates.io fetches occasionally drop mid-transfer on CI (curl 56,
          # connection reset). cargo's default is 3 retries; 10 rides out a
          # short registry blip instead of failing the whole build.
          echo "CARGO_NET_RETRY=10"
          # HTTP/2 multiplexing intermittently fails crates.io with a framing
          # layer error (curl 16) that the retry above doesn't catch; HTTP/1.1
          # avoids that class.
          echo "CARGO_HTTP_MULTIPLEXING=false"
        } >> "$GITHUB_ENV"
        # Submodule pins arrive via env (hoisted from step outputs). Heredoc
        # with a random delimiter so a stray newline can't inject entries.
        # The wasm and xcode caches key on SUBMODULE_PDF_OXIDE.
        {
          echo "SUBMODULE_PDF_OXIDE<<__SUB_PDF__"
          echo "${STEPS_SUB_OUTPUTS_PDF_OXIDE}"
          echo "__SUB_PDF__"
          echo "SUBMODULE_OFFICE_OXIDE<<__SUB_OFFICE__"
          echo "${STEPS_SUB_OUTPUTS_OFFICE_OXIDE}"
          echo "__SUB_OFFICE__"
        } >> "$GITHUB_ENV"
