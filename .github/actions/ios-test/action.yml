name: iOS Integration Test
description: Boot iOS simulator, compile Rust for iOS, run Flutter integration test

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: subosito/flutter-action@v2
      with:
        channel: stable

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios,aarch64-apple-ios-sim

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: vendor/pdf_oxide

    - uses: futureware-tech/simulator-action@v4
      with:
        model: 'iPhone 16'

    - name: Run integration tests
      shell: bash
      run: |
        cd example
        flutter pub get
        DEVICE=$(xcrun simctl list devices booted -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(u for r in d.values() for u in r if u['state']=='Booted')['udid'])")
        flutter test integration_test/pdf_smoke_test.dart -d "$DEVICE"
