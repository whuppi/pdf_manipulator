name: Compile WASM
description: Build pdf_oxide WASM + JS glue via Makefile

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with: { targets: wasm32-unknown-unknown }
    - shell: bash
      run: |
        cargo install wasm-bindgen-cli --version 0.2.121
        sudo apt-get update && sudo apt-get install -y binaryen
    - shell: bash
      run: make compile-wasm
    - shell: bash
      run: |
        mkdir -p out/wasm
        cp web_assets/pdf_oxide.js web_assets/pdf_oxide_bg.wasm out/wasm/
