name: Compile WASM
description: Build pdf_oxide WASM + run wasm-bindgen

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - uses: dtolnay/rust-toolchain@stable
      with: { targets: wasm32-unknown-unknown }
    - uses: Swatinem/rust-cache@v2
      with: { workspaces: vendor/pdf_oxide }
    - shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.121
    - shell: bash
      env:
        MANIFEST: vendor/pdf_oxide/Cargo.toml
      run: |
        rustup target add wasm32-unknown-unknown
        cargo build --manifest-path $MANIFEST --lib --target wasm32-unknown-unknown --features wasm --no-default-features --release
        mkdir -p out/wasm
        wasm-bindgen --target web --out-dir out/wasm --out-name pdf_oxide \
          vendor/pdf_oxide/target/wasm32-unknown-unknown/release/pdf_oxide.wasm
