name: Setup FVM
description: Install Dart SDK, FVM, and the project's pinned Flutter/Dart SDK from .fvmrc

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1
    - name: Install fvm + project SDK
      shell: bash
      run: |
        # Determine pub global bin path
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          PUB_BIN="$LOCALAPPDATA/Pub/Cache/bin"
        else
          PUB_BIN="$HOME/.pub-cache/bin"
        fi
        # Add to PATH for this step (export) AND future steps (GITHUB_PATH)
        export PATH="$PUB_BIN:$PATH"
        echo "$PUB_BIN" >> $GITHUB_PATH
        # Now install
        dart pub global activate fvm
        fvm install
