name: Setup FVM
description: Install Dart SDK, FVM, and the project's pinned Flutter/Dart SDK from .fvmrc

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1
    - name: Install fvm + project SDK
      shell: bash
      run: |
        dart pub global activate fvm
        # GITHUB_PATH only affects the NEXT workflow step, not subsequent steps
        # within this composite action. Use full path for fvm in this step,
        # then add to GITHUB_PATH for all later steps.
        echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
        "$HOME/.pub-cache/bin/fvm" install
