name: Make Target
description: >
  Thin wrapper over the shared whuppi/ci make-target. Provisions pdf's
  native/wasm capabilities (rust, wasm-cache, wasm-build) — which whuppi/ci
  doesn't know about — then DELEGATES the generic orchestration and the make
  run to whuppi/ci/actions/make-target. Only the pdf-specific glue lives here;
  the generic capabilities and run logic come from the shared action, so this
  can't drift structurally the way the old full fork did (one whuppi/ci ref
  instead of a dozen).

  Ordering: the local capabilities run before the shared action. rust sets
  SUBMODULE_PDF_OXIDE in $GITHUB_ENV; wasm-cache reads it, and it is forwarded
  to the shared xcode-cache below as xcode-key-extra. None of the three needs
  Flutter (compile_rust.sh is pure cargo), so running them before the shared
  action's fvm install is safe. No pdf job combines free-disk with wasm-build
  (checked against the full-test matrix), so wasm-build never needs disk
  reclaimed first — the one ordering the shared action can't provide.

inputs:
  make-target:
    description: "Makefile target to run"
    required: true
  rust:
    description: "Install the Rust toolchain (off for Dart-only static jobs)"
    required: false
    default: 'true'
  wasm-cache:
    description: "Cache WASM build"
    required: false
    default: 'false'
  wasm-build:
    description: "Compile WASM from source"
    required: false
    default: 'false'
  free-disk:
    description: "Reclaim disk for build-heavy jobs (Linux)"
    required: false
    default: 'false'
  java:
    description: "Install JDK"
    required: false
    default: 'false'
  chrome:
    description: "Install Chrome + ChromeDriver"
    required: false
    default: 'false'
  headless-display:
    description: "Virtual display for headless GUI"
    required: false
    default: 'false'
  hw-accel:
    description: "Hardware acceleration for emulators"
    required: false
    default: 'false'
  gradle-cache:
    description: "Cache Gradle"
    required: false
    default: 'false'
  xcode-cache:
    description: "Cache Xcode derived data"
    required: false
    default: 'false'
  xcode-cache-target:
    description: "ios or macos — Xcode cache key"
    required: false
    default: ''
  pods-cache:
    description: "Cache CocoaPods"
    required: false
    default: 'false'
  emulator:
    description: "Boot Android emulator (wraps make-target)"
    required: false
    default: 'false'
  simulator:
    description: "Boot iOS simulator"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # ── pdf-specific capabilities, before the shared run ──
    # Default on: most jobs build the native/wasm engine. Dart-only static jobs
    # (pana, downgrade-analyze) pass rust: false. rust sets SUBMODULE_PDF_OXIDE
    # (read by wasm-cache below and by the shared xcode-cache via xcode-key-extra).
    - uses: ./.github/actions/capabilities/rust
      if: inputs.rust == 'true'

    - uses: ./.github/actions/capabilities/wasm-cache
      if: inputs.wasm-cache == 'true'

    - uses: ./.github/actions/capabilities/wasm-build
      if: inputs.wasm-build == 'true'

    # ── Delegate everything generic to the shared action ──
    # fvm (always), the on-demand generic capabilities, and the make run all
    # live in whuppi/ci. xcode-key-extra carries the pdf_oxide submodule rev
    # that rust hoisted into the env, preserving the exact xcode cache key the
    # old fork built by hand.
    - uses: whuppi/ci/actions/make-target@v1.0.7
      with:
        make-target: ${{ inputs.make-target }}
        free-disk: ${{ inputs.free-disk }}
        java: ${{ inputs.java }}
        chrome: ${{ inputs.chrome }}
        headless-display: ${{ inputs.headless-display }}
        hw-accel: ${{ inputs.hw-accel }}
        gradle-cache: ${{ inputs.gradle-cache }}
        xcode-cache: ${{ inputs.xcode-cache }}
        xcode-cache-target: ${{ inputs.xcode-cache-target }}
        xcode-key-extra: ${{ env.SUBMODULE_PDF_OXIDE }}
        pods-cache: ${{ inputs.pods-cache }}
        emulator: ${{ inputs.emulator }}
        simulator: ${{ inputs.simulator }}
