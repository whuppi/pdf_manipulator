# Daily upgrade radar. The generic pieces (Flutter SDK pin + lockfile refresh)
# run via the shared reusable workflow; the ONE pdf-specific piece stays local:
# this repo's own gate tools (pana), bumped by
# tool/ci/upgrade.sh with recomputed sha256s in its own reviewed PR.
#
# The shared tool pins (fvm, Chrome, bore) live in whuppi/ci — its self-upgrade
# bumps them, and they reach this repo via a whuppi/ci release + the
# composite-refs sweep bumping the whuppi/ci refs (workflows and composites).
name: Upgrade Check

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 8am UTC
  workflow_dispatch:

permissions: {}

# Daily radar — never cancel an in-flight run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Flutter SDK (.fvmrc + example/.fvmrc) + lockfiles, each its own PR — plus
  # the action-refs sweep (sweepActions), the SINGLE owner of every action
  # `uses:` ref: whuppi/ci refs (workflows + composites, uniform) and every
  # third-party action (workflows + composites) to SHA. Dependabot owns pub only
  # — the github-actions ecosystem is gone from dependabot.yml. The sweep pushes
  # .github/workflows/ changes, which GITHUB_TOKEN can't — hence CI_ACTIONS_TOKEN.
  shared:
    permissions:
      contents: write       # pushes the chore/flutter-sdk + chore/lockfiles branches
      pull-requests: write  # opens / edits the upgrade PRs
    uses: whuppi/ci/.github/workflows/upgrade-check.yml@v2.7.3
    with:
      branch: dev
      sweepActions: true
    secrets:
      CI_ACTIONS_TOKEN: ${{ secrets.CI_ACTIONS_TOKEN }}

  # Security-sensitive: this repo's OWN gate tools
  # (pana), sha256s recomputed from upstream assets. Kept in its own PR so a
  # reviewer sees every hash change undiluted.
  pins:
    name: Pinned versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write       # pushes the chore/pins branch
      issues: write         # gh label create fallback (labels.yml is canonical)
      pull-requests: write  # opens / edits the pins PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      # Tamper check FIRST: re-hash the already-pinned assets. A hash that moved
      # while its version did NOT is an upstream repoint — fail, never bump.
      - name: Verify pinned assets unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/upgrade.sh verify-pinned

      - name: Prepare pins branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # persist-credentials:false leaves the remote unauthenticated — wire
          # gh's token into git so the branch push below works.
          gh auth setup-git
          gh label create upgrade-pins --description "Auto: pinned version bump (review the hashes)" --color "1d76db" 2>/dev/null || true
          EXISTING_PR=$(gh pr list --label upgrade-pins --state open --json number --jq '.[0].number // empty')
          echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTING_PR" ]; then
            git fetch origin chore/pins 2>/dev/null || true
            git checkout -B chore/pins origin/chore/pins 2>/dev/null || git checkout -b chore/pins
          else
            git checkout -b chore/pins
          fi

      # Bump tool/versions.env in place. Pure curl/jq/sed/gh (no Dart, no SDK).
      - name: Bump pinned versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/ci/upgrade.sh apply

      - name: Commit + open or update the pins PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_PR: ${{ steps.branch.outputs.existing_pr }}
        run: |
          git add tool/versions.env
          git commit -m "chore: bump pinned versions" || {
            echo "Pins already fresh — nothing to bump."
            exit 0
          }
          if [ -n "$EXISTING_PR" ]; then
            git push origin chore/pins
          else
            # Any remote copy is debris from a closed PR. Plain --force, not
            # --force-with-lease: only the bot pushes this branch, and lease
            # fails when there's no remote-tracking ref (fresh or post-merge).
            git push --force origin chore/pins
          fi

          PR_BODY="$(cat <<'EOF'
          Supply-chain pin bump — review the recomputed hashes in the diff:

          - **Pins in `tool/versions.env`**: this repo's own gate pins.
            See the diff for which versions moved.

          The already-pinned assets were re-hashed before this bump (repoint alarm).
          Add `ready-to-test` for the full cross-target run, then merge once green.

          _Auto-generated by upgrade-check.yml_
          EOF
          )"

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base dev \
              --head chore/pins \
              --title "chore: bump pinned versions" \
              --label upgrade-pins \
              --draft \
              --body "$PR_BODY"
          else
            gh pr edit "$EXISTING_PR" \
              --title "chore: bump pinned versions" \
              --body "$PR_BODY"
          fi
