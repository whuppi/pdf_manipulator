# Daily upgrade radar — two independent checks:
#   flutter       — new Flutter stable → opens (or updates) one upgrade PR.
#   package-deps  — dependency drift vs the constraint doctrine → warning
#                   annotations only; this job never goes red on drift.
# Runner-agnostic — configurable via workflow_dispatch (default: ubuntu-24.04).
name: Upgrade Check

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 8am UTC
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner"
        type: choice
        options: [ubuntu-24.04, macos-14, windows-2025-vs2026]
        default: ubuntu-24.04

permissions:
  contents: write
  pull-requests: write

env:
  DEFAULT_RUNNER: ubuntu-24.04

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        run: echo "runner=${{ inputs.runner || env.DEFAULT_RUNNER }}" >> $GITHUB_OUTPUT

  check:
    name: Flutter upgrade check
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Check for new Flutter stable
        id: check
        run: |
          CURRENT=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
          RELEASES_JSON=$(curl -sS https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json)
          STABLE_HASH=$(echo "$RELEASES_JSON" | grep -oE '"stable" *: *"[^"]*"' | head -1 | sed 's/"stable" *: *"//;s/"//')
          LATEST=$(echo "$RELEASES_JSON" | grep -A5 "\"hash\" *: *\"${STABLE_HASH}\"" | grep -oE '"version" *: *"[^"]*"' | head -1 | sed 's/"version" *: *"//;s/"//')

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          if [ -z "$LATEST" ]; then
            echo "needs_upgrade=false" >> $GITHUB_OUTPUT
            echo "::error::Could not detect latest Flutter stable version"
          elif [ "$CURRENT" = "$LATEST" ]; then
            echo "needs_upgrade=false" >> $GITHUB_OUTPUT
            echo "Already on latest stable: $CURRENT"
          else
            echo "needs_upgrade=true" >> $GITHUB_OUTPUT
            echo "New stable: $CURRENT → $LATEST"
          fi

      - name: Create or update upgrade PR
        if: steps.check.outputs.needs_upgrade == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          BRANCH="chore/flutter-upgrade"
          LABEL="flutter-upgrade"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure label exists
          gh label create "$LABEL" --description "Auto: Flutter version bump" --color "1d76db" 2>/dev/null || true

          # Find existing open upgrade PR by label (reliable, survives title/body edits)
          EXISTING_PR=$(gh pr list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            # Check what version the existing PR targets via structured comment
            EXISTING_VER=$(gh pr view "$EXISTING_PR" --json body --jq '.body' \
              | grep -oP '<!-- flutter-target: \K[^ ]+(?= -->)' || echo "unknown")

            if [ "$EXISTING_VER" = "$LATEST" ]; then
              echo "PR #$EXISTING_PR already targets $LATEST"
              exit 0
            fi

            echo "Updating PR #$EXISTING_PR: $EXISTING_VER → $LATEST"
            git fetch origin "$BRANCH" 2>/dev/null || true
            git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout -b "$BRANCH"
          else
            echo "Creating new upgrade PR"
            git checkout -b "$BRANCH"
          fi

          # Update both .fvmrc files (root + example)
          for fvmrc in .fvmrc example/.fvmrc; do
            sed -i "s/\"flutter\": *\"[^\"]*\"/\"flutter\": \"$LATEST\"/" "$fvmrc"
          done

          git add .fvmrc example/.fvmrc
          git commit -m "chore: bump Flutter $CURRENT → $LATEST" || {
            echo ".fvmrc already at $LATEST"
            exit 0
          }
          if [ -n "$EXISTING_PR" ]; then
            # Live PR branch — append only, never rewrite.
            git push origin "$BRANCH"
          else
            # No open PR references this branch, so any remote copy is
            # debris from a closed PR whose branch was never deleted —
            # exactly the state that rejects a plain push. Overwrite it.
            git push --force origin "$BRANCH"
          fi

          # PR body with structured comment for machine parsing
          PR_BODY="$(cat <<EOF
          <!-- flutter-target: $LATEST -->

          New Flutter stable release detected.

          | | Version |
          |---|---|
          | Current | \`$CURRENT\` |
          | New | \`$LATEST\` |

          **What to do:**
          - CI runs basic checks (analyze + native test) automatically
          - Add \`ready-to-test\` label for full cross-target test
          - Green → merge. Red → pull branch, fix, push.

          _Auto-generated by upgrade-check.yml_
          EOF
          )"

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "chore: bump Flutter $CURRENT → $LATEST" \
              --label "$LABEL" \
              --draft \
              --body "$PR_BODY"
          else
            gh pr edit "$EXISTING_PR" \
              --title "chore: bump Flutter $CURRENT → $LATEST" \
              --body "$PR_BODY"
          fi

  package-deps:
    name: Package dependency report
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          submodules: recursive
      - uses: ./.github/actions/make-target
        with:
          make-target: check-deps
