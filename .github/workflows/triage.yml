# Lightweight triage — auto-assign, auto-label, revoke stale labels.
# Uses REST API (not GraphQL) for fork PR compatibility.
# File-path labeling delegated to actions/labeler (Flutter's pattern).
name: Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  DEFAULT_RUNNER: ubuntu-24.04

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        run: echo "runner=${{ env.DEFAULT_RUNNER }}" >> $GITHUB_OUTPUT

  # ── Auto-label by file path (actions/labeler) ──
  label-by-files:
    name: Label by changed files
    needs: inputs
    if: github.event_name == 'pull_request_target'
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - uses: actions/labeler@v6
        with:
          sync-labels: false

  # ── Auto-label by PR title + branch ──
  label-by-title:
    name: Label by title
    needs: inputs
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Label by conventional commit title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          TITLE="${{ github.event.pull_request.title }}"
          HEAD="${{ github.event.pull_request.head.ref }}"
          BASE="${{ github.event.pull_request.base.ref }}"

          add_label() {
            gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" --silent 2>/dev/null || true
          }

          if echo "$TITLE" | grep -qE '^fix(\(|!?:)'; then
            add_label "bug"
          elif echo "$TITLE" | grep -qE '^feat(\(|!?:)'; then
            add_label "feature"
          fi

          if [[ "$HEAD" == "dev" && "$BASE" == "prod" ]]; then
            add_label "release"
          fi

  # ── Auto-assign maintainer ──
  assign:
    name: Assign maintainer
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Assign maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            NUM="${{ github.event.issue.number }}"
          else
            NUM="${{ github.event.pull_request.number }}"
          fi
          gh api "repos/$REPO/issues/$NUM/assignees" \
            -f "assignees[]=chaudharydeepanshu" --silent 2>/dev/null || true

  # ── Revoke stale ready-to-test on new commits ──
  revoke-ready-to-test:
    name: Revoke ready-to-test
    needs: inputs
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-test')
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Remove label + notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          gh api "repos/$REPO/issues/$PR/labels/ready-to-test" -X DELETE --silent 2>/dev/null || true
          gh api "repos/$REPO/issues/$PR/comments" \
            -f "body=Label \`ready-to-test\` removed — new commits pushed. Re-add when ready." \
            --silent 2>/dev/null || true

  # ── Dependabot recreate notice ──
  dependabot-needs-recreate:
    name: Dependabot recreate notice
    needs: inputs
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.sender.login != 'dependabot[bot]'
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Notify maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f "body=New commits pushed — workflows may be outdated. A maintainer with push access should comment \`@dependabot recreate\` to pick up the latest changes." \
            --silent 2>/dev/null || true
