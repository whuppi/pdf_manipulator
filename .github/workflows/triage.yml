# Lightweight triage — no LLM, just rules.
# Auto-assigns, auto-labels based on file paths.
# Piku will replace this with intelligent triage later.
name: Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  # When a non-dependabot push lands on a dependabot PR (e.g. human clicks
  # "Update branch"), workflows may be outdated. github-actions[bot] can't
  # run dependabot commands (no push access), so we comment asking a human.
  # Skips when dependabot itself pushes (after a recreate) to avoid loops.
  dependabot-needs-recreate:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.sender.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Notify maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body \
            "New commits pushed — workflows may be outdated. A maintainer with push access should comment \`@dependabot recreate\` to pick up the latest changes."

  assign-and-label:
    runs-on: ubuntu-latest
    steps:
      # Auto-assign maintainer on everything
      - name: Auto-assign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "issues" ]]; then
            gh issue edit ${{ github.event.issue.number }} \
              --repo ${{ github.repository }} \
              --add-assignee chaudharydeepanshu
          else
            gh pr edit ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --add-assignee chaudharydeepanshu
          fi

      # Auto-label PRs based on files changed
      - name: Auto-label PR
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Use the REST API files endpoint instead of gh pr view --json files.
          # gh pr view internally fetches the diff, which fails with HTTP 406
          # on PRs exceeding GitHub's 20,000-line diff limit.
          FILES=$(gh api repos/${{ github.repository }}/pulls/$PR/files --paginate --jq '.[].filename' 2>/dev/null || echo "")

          if echo "$FILES" | grep -qE "^\.github/|^\.githooks/"; then
            gh pr edit $PR --repo ${{ github.repository }} --add-label "ci"
          fi

          if echo "$FILES" | grep -qE "web_assets/|_web\.dart|worker\.js|wasm"; then
            gh pr edit $PR --repo ${{ github.repository }} --add-label "web"
          fi

          if echo "$FILES" | grep -qE "^vendor/"; then
            gh pr edit $PR --repo ${{ github.repository }} --add-label "upstream"
          fi

          # Auto-label by PR title (conventional commits)
          TITLE="${{ github.event.pull_request.title }}"
          if echo "$TITLE" | grep -qE '^fix(\(|!?:)'; then
            gh pr edit $PR --repo ${{ github.repository }} --add-label "bug"
          elif echo "$TITLE" | grep -qE '^feat(\(|!?:)'; then
            gh pr edit $PR --repo ${{ github.repository }} --add-label "feature"
          fi

          # Auto-label promotion PRs
          HEAD="${{ github.event.pull_request.head.ref }}"
          BASE="${{ github.event.pull_request.base.ref }}"
          if [[ "$HEAD" == "dev" && "$BASE" == "prod" ]]; then
            gh pr edit $PR --repo ${{ github.repository }} --add-label "release"
          fi
