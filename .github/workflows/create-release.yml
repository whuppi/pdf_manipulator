# Release pipeline: gate → discover → compile → upload → publish.
#
# All release logic lives in tool/ci/release.sh. This workflow only
# handles job orchestration.
#
# Runners: infra jobs (gate, discover, upload, publish) use one
# configurable runner (default: ubuntu-24.04). Compile jobs use
# target-specific runners in a matrix (macos for ios/macos,
# ubuntu for android/linux/wasm, windows for windows).
#
# Automatic on changelog push. Manual via workflow_dispatch.
# Publish job requires environment approval (human gate before pub.dev).
# Idempotent — rerun skips existing releases, clobbers existing assets.
name: Release

on:
  push:
    branches: [dev, prod]
    paths:
      - 'CHANGELOG.md'
      - 'CHANGELOG.pre.md'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      runner:
        description: "Runner for infra jobs (gate, discover, upload, publish)"
        type: choice
        options: [ubuntu-24.04, macos-14, windows-2025-vs2026]
        default: ubuntu-24.04

permissions: {}

# A release must finish — never cancel an in-flight release run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPILE_OUTPUT_DIR: out
  DEFAULT_RUNNER: ubuntu-24.04

# Every run step uses bash, on any runner. The runner can be overridden to
# Windows, where the default shell is pwsh and bash syntax would break.
defaults:
  run:
    shell: bash

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        env:
          OVERRIDE: ${{ inputs.runner }}
          DEFAULT: ${{ env.DEFAULT_RUNNER }}
        run: echo "runner=${OVERRIDE:-$DEFAULT}" >> "$GITHUB_OUTPUT"

  # ── Gate ─────────────────────────────────────────────────────────
  gate:
    name: Release gate
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    permissions:
      contents: read  # checkout + changelog gate, read-only
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref_name }}
          persist-credentials: false
      # Backstop: even if a faulty merge skipped the PR check, refuse to
      # release a lane whose changelog adds more than one new version.
      # Checks the lane being released (the pushed branch).
      - name: Version sanity
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: bash tool/ci/release.sh --check-versions
      - name: Check changelog relevance
        id: check
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash tool/ci/release.sh --gate

  # ── Discover version + create release ────────────────────────────
  discover:
    name: Discover versions
    needs: [inputs, gate]
    if: needs.gate.outputs.should_run == 'true'
    concurrency:
      group: release-${{ needs.gate.outputs.version || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ needs.inputs.outputs.runner }}
    permissions:
      contents: write  # release.sh --discover creates the GitHub release
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
      has_release: ${{ steps.find.outputs.has_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref_name }}
          submodules: recursive
          persist-credentials: false
      - name: Find + create release
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: bash tool/ci/release.sh --discover

  # ── Compile all targets ──────────────────────────────────────────
  compile:
    needs: discover
    if: needs.discover.outputs.has_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos,   runner: macos-14 }
          - { name: ios,     runner: macos-14 }
          - { name: android, runner: ubuntu-24.04 }
          - { name: linux,   runner: ubuntu-24.04 }
          - { name: wasm,    runner: ubuntu-24.04 }
          - { name: windows, runner: windows-2025-vs2026 }
    name: compile-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read  # checkout + build; artifacts use run storage, no API
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.discover.outputs.tag }}
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/make-target
        with:
          make-target: compile-${{ matrix.name }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.name }}
          path: out/

  # ── Upload binaries + stamp tag ──────────────────────────────────
  upload-assets:
    name: Upload Release Assets
    needs: [inputs, discover, compile]
    if: needs.discover.outputs.has_release == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    permissions:
      contents: write  # uploads binaries + stamps the release tag
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: artifacts/ }
      - name: Flatten assets
        run: |
          mkdir -p release
          for runner in bin-macos bin-ios bin-android bin-linux bin-windows; do
            for pdir in "artifacts/$runner"/*/; do
              [ -d "$pdir" ] || continue
              p=$(basename "$pdir")
              for lib in "$pdir"*; do
                [ -f "$lib" ] || continue
                cp "$lib" "release/${p}-$(basename "$lib")"
              done
            done
          done
          if [ -d "artifacts/bin-wasm/wasm" ]; then
            for f in artifacts/bin-wasm/wasm/*; do
              [ -f "$f" ] || continue
              cp "$f" "release/wasm-$(basename "$f")"
            done
          fi
          ls -lh release/
      - name: Verify all binaries present
        run: |
          EXPECTED=(
            android-arm-libpdf_oxide.so
            android-arm64-libpdf_oxide.so
            android-x64-libpdf_oxide.so
            android-x86-libpdf_oxide.so
            ios-arm64-libpdf_oxide.a
            ios-sim-arm64-libpdf_oxide.a
            ios-sim-x64-libpdf_oxide.a
            linux-arm64-libpdf_oxide.so
            linux-x64-libpdf_oxide.so
            macos-arm64-libpdf_oxide.dylib
            macos-x64-libpdf_oxide.dylib
            windows-arm64-pdf_oxide.dll
            windows-x64-pdf_oxide.dll
            wasm-pdf_oxide.js
            wasm-pdf_oxide_bg.wasm
          )
          MISSING=()
          for f in "${EXPECTED[@]}"; do
            [ -f "release/$f" ] || MISSING+=("$f")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing binaries: ${MISSING[*]}"
            exit 1
          fi
          echo "All ${#EXPECTED[@]} binaries present"
      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This step runs before any checkout, so gh has no .git to infer the
          # target repo from. GH_REPO names it, or gh exits "not a git repo".
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.discover.outputs.tag }}
        # gh ships on the runner; the release already exists (discover
        # created it), so just upload the binaries, clobbering on rerun.
        run: gh release upload "$TAG" release/* --clobber
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: '${{ needs.discover.outputs.tag }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Add git install snippet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.discover.outputs.tag }}
        run: bash tool/ci/release.sh --add-git-install "$TAG"
      - name: Stamp asset hashes into tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.discover.outputs.tag }}
        run: bash tool/ci/release.sh --update-tag-hashes "$TAG"
      - name: Preview pub.dev changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.discover.outputs.tag }}
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  CHANGELOG PREVIEW — review before approving publish"
          echo "═══════════════════════════════════════════════════"
          echo ""
          bash tool/ci/release.sh --stamp-changelog "$TAG"
          cat CHANGELOG.md

  # ── Publish to pub.dev ───────────────────────────────────────────
  publish:
    name: Publish to pub.dev
    needs: [inputs, discover, upload-assets]
    if: needs.discover.outputs.has_release == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    environment: ${{ inputs.branch || github.ref_name }}
    permissions:
      contents: write  # ephemeral stamp commit + release-notes install snippet
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: '${{ needs.discover.outputs.tag }}'
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - name: Install fvm + project SDK
        # Pin the fvm TOOL (the Flutter SDK is pinned in .fvmrc). Version
        # lives in tool/versions.env so it never floats on @latest.
        run: |
          source tool/versions.env
          dart pub global activate fvm "$FVM_VERSION"
          fvm install
      - name: Build filtered changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.discover.outputs.tag }}
        run: bash tool/ci/release.sh --stamp-changelog "$TAG"
      - name: Flatten README banner for pub.dev
        run: bash tool/ci/release.sh --stamp-readme
      - name: Ephemeral commit (clean git for pub publish)
        env:
          TAG: ${{ needs.discover.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stamp: $TAG" --allow-empty
      - name: Materialize pub.dev credentials
        env:
          PUB_CREDS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDS" > "$HOME/.config/dart/pub-credentials.json"
      - run: fvm dart pub get --no-example
      - run: fvm dart pub publish --force
      - name: Add pub.dev install snippet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.discover.outputs.tag }}
        run: bash tool/ci/release.sh --add-pub-install "$TAG"
