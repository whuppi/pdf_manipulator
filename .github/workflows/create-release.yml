# Release pipeline: gate → discover → compile → upload → publish.
#
# All release logic lives in tool/release.sh. This workflow only
# handles job orchestration.
#
# Runners: infra jobs (gate, discover, upload, publish) use one
# configurable runner (default: ubuntu-latest). Compile jobs use
# target-specific runners in a matrix (macos for ios/macos,
# ubuntu for android/linux/wasm, windows for windows).
#
# Automatic on changelog push. Manual via workflow_dispatch.
# Publish job requires environment approval (human gate before pub.dev).
# Idempotent — rerun skips existing releases, clobbers existing assets.
name: Release

on:
  push:
    branches: [dev, prod]
    paths:
      - 'CHANGELOG.md'
      - 'CHANGELOG.pre.md'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check (dev or prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      runner:
        description: "Runner for infra jobs (gate, discover, upload, publish)"
        type: choice
        options: [ubuntu-latest, macos-14, windows-latest]
        default: ubuntu-latest

permissions:
  contents: write

env:
  COMPILE_OUTPUT_DIR: out
  DEFAULT_RUNNER: ubuntu-latest

jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        run: echo "runner=${{ inputs.runner || env.DEFAULT_RUNNER }}" >> $GITHUB_OUTPUT

  # ── Gate ─────────────────────────────────────────────────────────
  gate:
    name: Release gate
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref_name }}
      - name: Check changelog relevance
        id: check
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash tool/release.sh --gate

  # ── Discover version + create release ────────────────────────────
  discover:
    name: Discover versions
    needs: [inputs, gate]
    if: needs.gate.outputs.should_run == 'true'
    concurrency:
      group: release-${{ needs.gate.outputs.version || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ needs.inputs.outputs.runner }}
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
      has_release: ${{ steps.find.outputs.has_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch || github.ref_name }}
          submodules: recursive
      - name: Find + create release
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ inputs.branch || github.ref_name }}
        run: bash tool/release.sh --discover

  # ── Compile all targets ──────────────────────────────────────────
  compile:
    needs: discover
    if: needs.discover.outputs.has_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos,   runner: macos-14 }
          - { name: ios,     runner: macos-14 }
          - { name: android, runner: ubuntu-latest }
          - { name: linux,   runner: ubuntu-latest }
          - { name: wasm,    runner: ubuntu-latest }
          - { name: windows, runner: windows-latest }
    name: compile-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.discover.outputs.tag }}
          submodules: recursive
      - uses: ./.github/actions/make-target
        with:
          make-target: compile-${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: out/

  # ── Upload binaries + stamp tag ──────────────────────────────────
  upload-assets:
    name: Upload Release Assets
    needs: [inputs, discover, compile]
    if: needs.discover.outputs.has_release == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with: { path: artifacts/ }
      - name: Flatten assets
        run: |
          mkdir -p release
          for runner in bin-macos bin-ios bin-android bin-linux bin-windows; do
            for pdir in artifacts/$runner/*/; do
              [ -d "$pdir" ] || continue
              p=$(basename "$pdir")
              for lib in "$pdir"*; do
                [ -f "$lib" ] || continue
                cp "$lib" "release/${p}-$(basename "$lib")"
              done
            done
          done
          if [ -d "artifacts/bin-wasm/wasm" ]; then
            for f in artifacts/bin-wasm/wasm/*; do
              [ -f "$f" ] || continue
              cp "$f" "release/wasm-$(basename "$f")"
            done
          fi
          ls -lh release/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.discover.outputs.tag }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v6
        with:
          ref: '${{ needs.discover.outputs.tag }}'
          fetch-depth: 0
      - name: Add git install snippet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/release.sh --add-git-install ${{ needs.discover.outputs.tag }}
      - name: Stamp asset hashes into tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/release.sh --update-tag-hashes ${{ needs.discover.outputs.tag }}
      - name: Preview pub.dev changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  CHANGELOG PREVIEW — review before approving publish"
          echo "═══════════════════════════════════════════════════"
          echo ""
          bash tool/release.sh --stamp-changelog ${{ needs.discover.outputs.tag }}
          cat CHANGELOG.md

  # ── Publish to pub.dev ───────────────────────────────────────────
  publish:
    name: Publish to pub.dev
    needs: [inputs, discover, upload-assets]
    if: needs.discover.outputs.has_release == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    environment: ${{ inputs.branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '${{ needs.discover.outputs.tag }}'
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
      - name: Install fvm + project SDK
        run: dart pub global activate fvm && fvm install
      - name: Build filtered changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/release.sh --stamp-changelog ${{ needs.discover.outputs.tag }}
      - name: Ephemeral commit (clean git for pub publish)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stamp: ${{ needs.discover.outputs.tag }}" --allow-empty
      - name: Materialize pub.dev credentials
        env:
          PUB_CREDS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.config/dart"
          printf '%s' "$PUB_CREDS" > "$HOME/.config/dart/pub-credentials.json"
      - run: fvm dart pub get --no-example
      - run: fvm dart pub publish --force
      - name: Add pub.dev install snippet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tool/release.sh --add-pub-install ${{ needs.discover.outputs.tag }}
