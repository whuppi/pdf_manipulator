# Enforce linear promotion: feature → dev → prod. No skipping.
name: Promotion Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, prod]

permissions: {}

jobs:
  check:
    name: Promotion Chain
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion path
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD → $BASE"

          # prod only accepts PRs from dev
          if [[ "$BASE" == "prod" && "$HEAD" != "dev" ]]; then
            echo "::error::prod only accepts PRs from dev. Got: $HEAD → prod"
            exit 1
          fi

          # dev accepts PRs from any feature branch (but not prod)
          if [[ "$BASE" == "dev" && "$HEAD" == "prod" ]]; then
            echo "::error::dev does not accept PRs from prod. Got: prod → dev"
            exit 1
          fi

          echo "✓ Valid promotion path: $HEAD → $BASE"
