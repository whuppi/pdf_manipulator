# CI — every PR. Fast gate: analyze + pkg-native test.
# Runner-agnostic — all jobs run on one configurable runner.
# Default: ubuntu-24.04. Override via workflow_dispatch.
name: CI

on:
  pull_request:
    branches: [prod, dev]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for all jobs"
        type: choice
        options: [ubuntu-24.04, macos-14, windows-2025-vs2026]
        default: ubuntu-24.04

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DEFAULT_RUNNER: ubuntu-24.04

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        run: echo "runner=${{ inputs.runner || env.DEFAULT_RUNNER }}" >> $GITHUB_OUTPUT

  changes:
    name: Detect changes
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'hook/**'
              - 'vendor/**'
              - 'web_assets/**'
              - 'example/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - 'Makefile'
              - '.github/**'
            rust:
              - 'vendor/**'
              - 'build.json'
              - 'Makefile'
              - '.github/**'

  analyze:
    name: Analyze
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: ./.github/actions/make-target
        with:
          make-target: analyze

  test:
    name: Package tests
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      - uses: ./.github/actions/make-target
        with:
          make-target: test-pkg-native

  # Vendored-engine cargo tests — only when a PR touches the engine, its
  # features, the Makefile, or CI. Skipped on Dart-only PRs.
  rust:
    name: Rust tests
    needs: [inputs, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive }
      # free-disk: the engine's debug build overruns a stock runner's
      # ~14 GB free; the capability reclaims room (Linux only).
      - uses: ./.github/actions/make-target
        with:
          make-target: test-rust
          free-disk: 'true'

  gate:
    name: CI Gate
    if: always()
    needs: [inputs, changes, analyze, test, rust]
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "Doc-only PR — CI gate passes"
            exit 0
          fi
          if [[ "${{ needs.analyze.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAILED: analyze=${{ needs.analyze.result }} test=${{ needs.test.result }}"
            exit 1
          fi
          # rust runs only when the engine/features/Makefile/CI change; skipped is OK.
          if [[ "${{ needs.rust.result }}" != "success" && "${{ needs.rust.result }}" != "skipped" ]]; then
            echo "FAILED: rust=${{ needs.rust.result }}"
            exit 1
          fi
          echo "All CI checks passed"
