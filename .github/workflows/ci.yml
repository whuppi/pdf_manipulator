# CI — every PR. Fast gate: analyze + unit + native ops.
# Reuses composite actions — same logic as full-test, just fewer platforms.
name: CI

on:
  pull_request:
    branches: [prod, dev]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'hook/**'
              - 'vendor/**'
              - 'web_assets/**'
              - 'example/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - 'Makefile'
              - '.github/**'

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-fvm
      - uses: ./.github/actions/setup-rust
        with: { targets: wasm32-unknown-unknown }
      - run: make analyze

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/pkg-test-native

  gate:
    name: CI Gate
    if: always()
    needs: [changes, analyze, test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "Doc-only PR — CI gate passes"
            exit 0
          fi
          if [[ "${{ needs.analyze.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAILED: analyze=${{ needs.analyze.result }} test=${{ needs.test.result }}"
            exit 1
          fi
          echo "All CI checks passed"
