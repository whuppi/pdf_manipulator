# CI — runs on PRs. Doc-only PRs skip expensive jobs; gate still passes.
name: CI

on:
  pull_request:
    branches: [prod, dev]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'hook/**'
              - 'vendor/**'
              - 'web_assets/**'
              - 'example/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - '.github/**'

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/workflows/actions/load_config
        id: config
      - uses: ./.github/workflows/actions/setup_flutter
        with:
          flutter_channel: ${{ steps.config.outputs.flutter_channel }}
      - run: flutter analyze .

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/workflows/actions/load_config
        id: config
      - uses: ./.github/workflows/actions/setup_flutter
        with:
          flutter_channel: ${{ steps.config.outputs.flutter_channel }}
      - uses: ./.github/workflows/actions/setup_rust
        with:
          rust_version: ${{ steps.config.outputs.rust_version }}
      - run: dart test --timeout=120s

  # Required check — always runs, gates on results when code changed.
  gate:
    name: CI Gate
    if: always()
    needs: [changes, analyze, test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "Doc-only PR — CI gate passes"
            exit 0
          fi
          if [[ "${{ needs.analyze.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAILED: analyze=${{ needs.analyze.result }} test=${{ needs.test.result }}"
            exit 1
          fi
          echo "All CI checks passed"
