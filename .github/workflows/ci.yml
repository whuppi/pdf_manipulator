# Lightweight CI — runs on every PR. Fast feedback.
name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - run: dart analyze lib/ test/ hook/

  test:
    name: Test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/dart-test
