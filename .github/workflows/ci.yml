# CI — every PR. Fast gate: analyze + pkg-native test.
# Runner-agnostic — all jobs run on one configurable runner.
# Default: ubuntu-latest. Override via workflow_dispatch.
name: CI

on:
  pull_request:
    branches: [prod, dev]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for all jobs"
        type: choice
        options: [ubuntu-latest, macos-14, windows-latest]
        default: ubuntu-latest

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DEFAULT_RUNNER: ubuntu-latest

jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        run: echo "runner=${{ inputs.runner || env.DEFAULT_RUNNER }}" >> $GITHUB_OUTPUT

  changes:
    name: Detect changes
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'hook/**'
              - 'vendor/**'
              - 'web_assets/**'
              - 'example/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - 'Makefile'
              - '.github/**'

  analyze:
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/make-target
        with:
          make-target: analyze

  test:
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/make-target
        with:
          make-target: test-pkg-native

  gate:
    name: CI Gate
    if: always()
    needs: [inputs, changes, analyze, test]
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "Doc-only PR — CI gate passes"
            exit 0
          fi
          if [[ "${{ needs.analyze.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAILED: analyze=${{ needs.analyze.result }} test=${{ needs.test.result }}"
            exit 1
          fi
          echo "All CI checks passed"
