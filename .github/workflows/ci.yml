# CI — runs on PRs. Doc-only PRs skip expensive jobs; gate still passes.
# All build/test logic lives in the Makefile. CI only provisions the environment.
# Makefile uses `fvm dart` / `fvm flutter` — CI installs fvm + project SDK.
name: CI

on:
  pull_request:
    branches: [prod, dev]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'hook/**'
              - 'vendor/**'
              - 'web_assets/**'
              - 'example/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - 'Makefile'
              - '.github/**'

  analyze:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install fvm + project SDK
        run: |
          dart pub global activate fvm
          fvm install
      - run: make analyze

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install fvm + project SDK
        run: |
          dart pub global activate fvm
          fvm install
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - run: make test-ops-native

  gate:
    name: CI Gate
    if: always()
    needs: [changes, analyze, test]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ needs.changes.outputs.code }}" != "true" ]]; then
            echo "Doc-only PR — CI gate passes"
            exit 0
          fi
          if [[ "${{ needs.analyze.result }}" != "success" ]] || [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAILED: analyze=${{ needs.analyze.result }} test=${{ needs.test.result }}"
            exit 1
          fi
          echo "All CI checks passed"
