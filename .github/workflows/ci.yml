# CI — every PR. Fast gate: analyze + pkg-native test.
# Runner-agnostic — all jobs run on one configurable runner.
# Default: ubuntu-24.04. Override via workflow_dispatch.
name: CI

on:
  pull_request:
    branches: [prod, dev]
  # Push-to-dev is the WARM SOURCE. GitHub lets a run read caches from its
  # own ref, the PR base and the default branch only, so the archives every
  # PR reads have to be written from `dev` itself — PR runs only read. The
  # paths are the inputs of the cargo cache key: anything else merged to
  # dev leaves the key (and the warm archives) unchanged, so no run.
  push:
    branches: [dev]
    paths:
      - 'vendor/**'
      - 'build.json'
      - 'tool/versions.env'
      - 'Makefile'
      - 'hook/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for all jobs"
        type: choice
        options: [ubuntu-24.04, macos-14, windows-2025-vs2026]
        default: ubuntu-24.04
      cold:
        description: "Cold build — ignore the cargo cache (proves a fresh clone builds)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DEFAULT_RUNNER: ubuntu-24.04
  # The cargo cache is on for every PR run; `cold: true` on a manual
  # dispatch turns it off for the whole run. The routine from-scratch
  # proof is the scheduled cold Full Test — see full-test.yml.
  RUST_CACHE: ${{ inputs.cold && 'false' || 'true' }}

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        shell: bash
        env:
          OVERRIDE: ${{ inputs.runner }}
          DEFAULT: ${{ env.DEFAULT_RUNNER }}
        run: echo "runner=${OVERRIDE:-$DEFAULT}" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect changes
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read  # checkout + paths-filter, read-only
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'hook/**'
              - 'vendor/**'
              - 'web_assets/**'
              - 'example/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - 'Makefile'
              - '.github/**'
            rust:
              - 'vendor/**'
              - 'build.json'
              - 'Makefile'
              - '.github/**'

  # Format + `dart analyze --fatal-infos` on the package and the example,
  # then `cargo check` of the vendored engine under BOTH shipped feature
  # sets (native and wasm) with our-code warnings fatal. The Rust half is
  # what catches a patch that compiles for one target and not the other
  # before a Full Test spends an hour on it. Needs submodules; does not
  # need the engine BUILT — the fixtures target is deliberately hook-free.
  analyze:
    name: Analyze
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read   # checkout + build, read-only
      packages: write  # oci-cache: the Flutter SDK lives on ghcr.io (read on PRs, write from dev)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/make-target
        with:
          make-target: analyze
          rust-cache-key: check
          rust-cache: ${{ env.RUST_CACHE }}
          # Write the cargo cache from dev (the warm source) and from a PR only
          # when its Rust inputs changed — that PR's key differs from dev's,
          # so without its own archive every push of it would build cold.
          rust-cache-save: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' }}
          cache-backend: ghcr
          cache-save: ${{ github.event_name == 'push' }}

  # Analyze the shipped code (lib/bin/hook) against the OLDEST in-range deps, so
  # the wide lower bounds are honest, not just the newest a fresh build resolves.
  # Static analysis only: no fixtures, no native build, no submodules needed.
  analyze-floor:
    name: Analyze (floor deps)
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read   # checkout + static analyze, read-only
      packages: write  # oci-cache: the Flutter SDK lives on ghcr.io (read on PRs, write from dev)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/make-target
        with:
          make-target: analyze-floor
          rust: false  # Dart-only static analysis, no toolchain or cargo cache to provision

  # Gate pub.dev platform support: pana (the same analyzer pub.dev runs) must
  # still report all 6 platforms, so an unconditional dart:io/ffi import that
  # silently drops web is caught here, not on pub.dev after publish. Static
  # analysis only: no submodules, no native build.
  platforms:
    name: Platform support
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read  # checkout + pana static analyze, read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/make-target
        with:
          make-target: platforms
          rust: false  # pana is Dart-only static analysis, no native build to provision

  # The fast gate's one real build: unit + native ops suites via `dart
  # test`, which runs hook/build.dart exactly as a downstream package would.
  # This is the only per-PR proof that the consumer hook still compiles the
  # engine from vendor source on a clean machine — Full Test is opt-in by
  # label, so if this job stops building the engine, a broken hook reaches
  # `dev` unnoticed. Keep it a real build; cache its inputs, don't stub it.
  test:
    name: Package tests
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read   # checkout + build, read-only
      packages: write  # oci-cache: the Flutter SDK lives on ghcr.io (read on PRs, write from dev)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      - uses: ./.github/actions/make-target
        with:
          make-target: test-pkg-native
          rust-cache-key: native
          rust-cache: ${{ env.RUST_CACHE }}
          # Write the cargo cache from dev (the warm source) and from a PR only
          # when its Rust inputs changed — that PR's key differs from dev's,
          # so without its own archive every push of it would build cold.
          rust-cache-save: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' }}
          cache-backend: ghcr
          cache-save: ${{ github.event_name == 'push' }}

  # Vendored-engine cargo tests — only when a PR touches the engine, its
  # features, the Makefile, or CI. Skipped on Dart-only PRs.
  # This is the upstream suite running against OUR patches, with the
  # test-only features the shipped builds exclude. A fork patch that breaks
  # upstream behaviour we don't exercise from Dart is caught here only.
  # The `rust` path filter is the trigger contract: widen it if the engine
  # gains a new input; never narrow it to make Dart PRs faster (they
  # already skip it).
  rust:
    name: Rust tests
    needs: [inputs, changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read   # checkout + build, read-only
      packages: write  # oci-cache: the Flutter SDK lives on ghcr.io (read on PRs, write from dev)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive, persist-credentials: false }
      # free-disk: the engine's debug test build (~330 binaries) once
      # overran a stock runner's ~14 GB free. The guard checks live
      # headroom and reclaims only when the image is short (Linux only).
      - uses: ./.github/actions/make-target
        with:
          make-target: test-rust
          rust-cache-key: test
          free-disk: 'true'
          rust-cache: ${{ env.RUST_CACHE }}
          # Write the cargo cache from dev (the warm source) and from a PR only
          # when its Rust inputs changed — that PR's key differs from dev's,
          # so without its own archive every push of it would build cold.
          rust-cache-save: ${{ github.event_name == 'push' || needs.changes.outputs.rust == 'true' }}
          cache-backend: ghcr
          cache-save: ${{ github.event_name == 'push' }}

  gate:
    name: CI Gate
    if: always()
    needs: [inputs, changes, analyze, analyze-floor, platforms, test, rust]
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          ANALYZE: ${{ needs.analyze.result }}
          FLOOR: ${{ needs.analyze-floor.result }}
          PLATFORMS: ${{ needs.platforms.result }}
          TEST: ${{ needs.test.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          # A failed (not skipped) changes job clears its outputs, so CODE
          # arrives empty — which must NOT read as "doc-only". Gate on the
          # job result before trusting its output.
          if [[ "$CHANGES" != "success" ]]; then
            echo "FAILED: change detection did not succeed (changes=$CHANGES)"
            exit 1
          fi
          if [[ "$CODE" != "true" ]]; then
            echo "Doc-only PR — CI gate passes"
            exit 0
          fi
          if [[ "$ANALYZE" != "success" ]] || [[ "$FLOOR" != "success" ]] || [[ "$PLATFORMS" != "success" ]] || [[ "$TEST" != "success" ]]; then
            echo "FAILED: analyze=$ANALYZE floor=$FLOOR platforms=$PLATFORMS test=$TEST"
            exit 1
          fi
          # rust runs only when the engine/features/Makefile/CI change; skipped is OK.
          if [[ "$RUST" != "success" && "$RUST" != "skipped" ]]; then
            echo "FAILED: rust=$RUST"
            exit 1
          fi
          echo "All CI checks passed"
