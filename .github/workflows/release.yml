# Test 6 platforms → compile 13 targets + WASM → GitHub Release.
# Re-runs overwrite existing releases for the same version.
name: Release

on:
  push:
    branches: [main]
    paths: ['pubspec.yaml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Version ────────────────────────────────────────────────────────
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$V" >> "$GITHUB_OUTPUT"

  # ── Test first ─────────────────────────────────────────────────────
  test-macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: ./.github/actions/dart-test
  test-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/dart-test
  test-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: ./.github/actions/dart-test
  test-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/android-test
  test-ios:
    needs: version
    runs-on: macos-14
    steps:
      - uses: ./.github/actions/ios-test
  test-web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/web-test

  # ── Compile (only after all tests pass) ────────────────────────────
  compile-macos:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: macos-14
    steps:
      - uses: ./.github/actions/compile-macos
      - uses: actions/upload-artifact@v4
        with: { name: bin-macos, path: out/ }
  compile-ios:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: macos-14
    steps:
      - uses: ./.github/actions/compile-ios
      - uses: actions/upload-artifact@v4
        with: { name: bin-ios, path: out/ }
  compile-android:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: macos-14
    steps:
      - uses: ./.github/actions/compile-android
      - uses: actions/upload-artifact@v4
        with: { name: bin-android, path: out/ }
  compile-linux:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/compile-linux
      - uses: actions/upload-artifact@v4
        with: { name: bin-linux, path: out/ }
  compile-wasm:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/compile-wasm
      - uses: actions/upload-artifact@v4
        with: { name: bin-wasm, path: out/ }
  compile-windows:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: windows-latest
    steps:
      - uses: ./.github/actions/compile-windows
      - uses: actions/upload-artifact@v4
        with: { name: bin-windows, path: out/ }

  # ── Release ────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [version, compile-macos, compile-ios, compile-android, compile-linux, compile-windows, compile-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete existing release (if re-running)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
      - uses: actions/download-artifact@v4
        with: { path: artifacts/ }
      - name: Flatten assets
        run: |
          mkdir -p release
          for runner in bin-macos bin-ios bin-android bin-linux bin-windows; do
            for pdir in artifacts/$runner/*/; do
              [ -d "$pdir" ] || continue
              p=$(basename "$pdir")
              for lib in "$pdir"*; do
                [ -f "$lib" ] || continue
                cp "$lib" "release/${p}-$(basename "$lib")"
              done
            done
          done
          if [ -d "artifacts/bin-wasm/wasm" ]; then
            for f in artifacts/bin-wasm/wasm/*; do
              [ -f "$f" ] || continue
              cp "$f" "release/wasm-$(basename "$f")"
            done
          fi
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.version }}"
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Validate pub.dev ───────────────────────────────────────────────
  pub-dry-run:
    name: pub.dev dry run
    needs: [test-macos, test-linux, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - run: dart pub publish --dry-run
