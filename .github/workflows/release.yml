# Full pipeline: test 6 platforms → compile all targets → upload to GitHub Release → publish to pub.dev.
# Triggered by tag push (release-please creates tags when you merge a Release PR).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Test all platforms ─────────────────────────────────────────────
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/dart-test
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/dart-test
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/dart-test
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/android-test
  test-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/ios-test
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/web-test

  # ── Compile (only after all tests pass) ────────────────────────────
  compile-macos:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/compile-macos
      - uses: actions/upload-artifact@v4
        with: { name: bin-macos, path: out/ }
  compile-ios:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/compile-ios
      - uses: actions/upload-artifact@v4
        with: { name: bin-ios, path: out/ }
  compile-android:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/compile-android
      - uses: actions/upload-artifact@v4
        with: { name: bin-android, path: out/ }
  compile-linux:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/compile-linux
      - uses: actions/upload-artifact@v4
        with: { name: bin-linux, path: out/ }
  compile-wasm:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/compile-wasm
      - uses: actions/upload-artifact@v4
        with: { name: bin-wasm, path: out/ }
  compile-windows:
    needs: [test-macos, test-linux, test-windows, test-android, test-ios, test-web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: ./.github/actions/compile-windows
      - uses: actions/upload-artifact@v4
        with: { name: bin-windows, path: out/ }

  # ── Upload binaries to the GitHub Release ──────────────────────────
  upload-assets:
    name: Upload Release Assets
    needs: [compile-macos, compile-ios, compile-android, compile-linux, compile-windows, compile-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts/ }
      - name: Flatten assets
        run: |
          mkdir -p release
          for runner in bin-macos bin-ios bin-android bin-linux bin-windows; do
            for pdir in artifacts/$runner/*/; do
              [ -d "$pdir" ] || continue
              p=$(basename "$pdir")
              for lib in "$pdir"*; do
                [ -f "$lib" ] || continue
                cp "$lib" "release/${p}-$(basename "$lib")"
              done
            done
          done
          if [ -d "artifacts/bin-wasm/wasm" ]; then
            for f in artifacts/bin-wasm/wasm/*; do
              [ -f "$f" ] || continue
              cp "$f" "release/wasm-$(basename "$f")"
            done
          fi
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Publish to pub.dev ─────────────────────────────────────────────
  publish:
    name: Publish to pub.dev
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: dart pub get --no-example
      - run: dart pub publish --force
