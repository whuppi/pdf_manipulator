# Enforce Conventional Commits on PR titles.
# Since we squash-merge, the PR title becomes the commit message.
name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, dev]

jobs:
  conventional-commit:
    name: Conventional Commit
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|chore|ci|test|refactor|perf|build|deps)(\(.+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits format."
            echo ""
            echo "  <type>[optional scope]: <description>"
            echo ""
            echo "  Types: feat fix docs chore ci test refactor perf build deps"
            echo "  Examples:"
            echo "    feat: add watermark support"
            echo "    fix(web): handle empty PDF edge case"
            echo "    feat!: redesign API (breaking change)"
            echo ""
            echo "  Your title: $TITLE"
            exit 1
          fi
          echo "✓ PR title is valid: $TITLE"
