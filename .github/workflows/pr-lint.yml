# All PR quality gates in one workflow.
# Jobs: conventional-commit title, promotion chain, changelog versions, and
# workflow lint (zizmor security + actionlint correctness over .github/).
# Runner-agnostic — all jobs run on one configurable runner (default ubuntu).
name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for all jobs"
        type: choice
        options: [ubuntu-24.04, macos-14, windows-2025-vs2026]
        default: ubuntu-24.04

permissions: {}

# One in-flight run per PR; new pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_RUNNER: ubuntu-24.04

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        shell: bash
        env:
          OVERRIDE: ${{ inputs.runner }}
          DEFAULT: ${{ env.DEFAULT_RUNNER }}
        run: echo "runner=${OVERRIDE:-$DEFAULT}" >> "$GITHUB_OUTPUT"

  # ── Conventional Commits ─────────────────────────────────────────
  conventional-commit:
    name: Conventional Commit
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Check PR title
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qE '^(feat|fix|docs|chore|ci|test|refactor|perf|build|deps)(\(.+\))?!?: .+' <<< "$TITLE"; then
            echo "::error::PR title must follow Conventional Commits format."
            echo ""
            echo "  <type>[optional scope]: <description>"
            echo ""
            echo "  Types: feat fix docs chore ci test refactor perf build deps"
            echo "  Examples:"
            echo "    feat: add watermark support"
            echo "    fix(web): handle empty PDF edge case"
            echo "    feat!: redesign API (breaking change)"
            echo ""
            echo "  Your title: $TITLE"
            exit 1
          fi
          echo "✓ PR title is valid: $TITLE"

  # ── Promotion Chain ──────────────────────────────────────────────
  promotion-check:
    name: Promotion Chain
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Validate promotion path
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD → $BASE"

          if [[ "$BASE" == "prod" && "$HEAD" != "dev" && "$HEAD" != hotfix/* ]]; then
            echo "::error::prod only accepts PRs from dev or hotfix/* branches. Got: $HEAD → prod"
            exit 1
          fi

          if [[ "$BASE" == "dev" && "$HEAD" == "prod" ]]; then
            echo "::error::dev does not accept PRs from prod. Got: prod → dev"
            exit 1
          fi

          echo "✓ Valid promotion path: $HEAD → $BASE"

  # ── Changelog Versions ───────────────────────────────────────────
  # Both lanes, every PR — a faulty changelog must never merge into a
  # release branch. Only the TOP heading of each file may be untagged
  # (the release candidate); every heading below must have its git tag
  # or a verified `<!-- release: no-tag -->` directive. See
  # tool/ci/release.sh --check-versions.
  changelog-check:
    name: Changelog Versions
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: One new version per lane
        shell: bash
        run: |
          rc=0
          echo "── prerelease lane (CHANGELOG.pre.md) ──"
          BRANCH=dev  bash tool/ci/release.sh --check-versions || rc=1
          echo ""
          echo "── stable lane (CHANGELOG.md) ──"
          BRANCH=prod bash tool/ci/release.sh --check-versions || rc=1
          exit $rc

  # ── Workflow lint (zizmor + actionlint) ──────────────────────────
  # zizmor = security: the whole .github tree must stay at auditor exit-0; the
  # only allowances are the two documented, doctrine-hardened suppressions in
  # triage.yml / retry.yml.
  # actionlint = correctness: valid YAML, expressions, runner labels, plus
  # Workflows (zizmor + actionlint) and shell scripts (shellcheck + a bash
  # 3.2 portability scan). zizmor/actionlint pinned; bumped by upgrade-check.
  workflow-lint:
    name: Workflow lint
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read  # checkout only; both tools read the workflow files
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: zizmor (security, auditor persona, zero findings)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}  # higher API rate limit for ref checks
        run: |
          source tool/versions.env
          pipx run "zizmor==$ZIZMOR_VERSION" --persona=auditor .github/
      - name: actionlint (correctness + shellcheck)
        shell: bash
        run: |
          source tool/versions.env
          go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          PATH="$(go env GOPATH)/bin:$PATH"
          actionlint -color
      - name: shell lint (shellcheck + bash 3.2 portability)
        shell: bash
        run: bash tool/lint_shell.sh

  # Runs on PR activity (not just the daily cron, which GitHub disables after
  # ~60 idle days): HEADs every pinned asset so a pruned pin fails the PR that
  # sits on it, before it fail-closes a build. Fails on a definitive 404/410,
  # warns on transient.
  pin-availability:
    name: Pin availability
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read  # checkout only; HEADs the pinned asset URLs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Pinned assets still reachable
        shell: bash
        run: bash tool/ci/upgrade.sh check-availability
