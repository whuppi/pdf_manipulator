# All PR quality gates in one workflow.
# Jobs: conventional commit title, promotion chain, workflow security scan.
# Runner-agnostic — all jobs run on one configurable runner.
# Default: ubuntu-24.04. Override via workflow_dispatch.
name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, prod]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for all jobs"
        type: choice
        options: [ubuntu-24.04, macos-14, windows-2025-vs2026]
        default: ubuntu-24.04

permissions: {}

env:
  DEFAULT_RUNNER: ubuntu-24.04

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        run: echo "runner=${{ inputs.runner || env.DEFAULT_RUNNER }}" >> $GITHUB_OUTPUT

  # ── Conventional Commits ─────────────────────────────────────────
  conventional-commit:
    name: Conventional Commit
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^(feat|fix|docs|chore|ci|test|refactor|perf|build|deps)(\(.+\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits format."
            echo ""
            echo "  <type>[optional scope]: <description>"
            echo ""
            echo "  Types: feat fix docs chore ci test refactor perf build deps"
            echo "  Examples:"
            echo "    feat: add watermark support"
            echo "    fix(web): handle empty PDF edge case"
            echo "    feat!: redesign API (breaking change)"
            echo ""
            echo "  Your title: $TITLE"
            exit 1
          fi
          echo "✓ PR title is valid: $TITLE"

  # ── Promotion Chain ──────────────────────────────────────────────
  promotion-check:
    name: Promotion Chain
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Validate promotion path
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD → $BASE"

          if [[ "$BASE" == "prod" && "$HEAD" != "dev" && "$HEAD" != hotfix/* ]]; then
            echo "::error::prod only accepts PRs from dev or hotfix/* branches. Got: $HEAD → prod"
            exit 1
          fi

          if [[ "$BASE" == "dev" && "$HEAD" == "prod" ]]; then
            echo "::error::dev does not accept PRs from prod. Got: prod → dev"
            exit 1
          fi

          echo "✓ Valid promotion path: $HEAD → $BASE"

  # ── Changelog Versions ───────────────────────────────────────────
  # Both lanes, every PR — a faulty changelog must never merge into a
  # release branch. Only the TOP heading of each file may be untagged
  # (the release candidate); every heading below must have its git tag
  # or a verified `<!-- release: no-tag -->` directive. See
  # tool/release.sh --check-versions.
  changelog-check:
    name: Changelog Versions
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: One new version per lane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          echo "── prerelease lane (CHANGELOG.pre.md) ──"
          BRANCH=dev  bash tool/release.sh --check-versions || rc=1
          echo ""
          echo "── stable lane (CHANGELOG.md) ──"
          BRANCH=prod bash tool/release.sh --check-versions || rc=1
          exit $rc

  # ── Workflow Security ────────────────────────────────────────────
  workflow-security:
    name: Workflow Security
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Scan for dangerous patterns
        run: |
          FAILED=false
          for f in .github/workflows/*.yml; do
            [[ "$f" == *"pr-lint"* ]] && continue

            if grep -q "pull_request_target" "$f"; then
              if grep -A5 "actions/checkout" "$f" | grep -qE "github\.event\.pull_request\.head\.(sha|ref)|pull_request\.head\.sha"; then
                echo "::error file=$f::SECURITY: $f uses pull_request_target with checkout of PR code. This gives attackers write access."
                FAILED=true
              fi
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            exit 1
          fi
          echo "✓ No dangerous pull_request_target + checkout patterns found"
