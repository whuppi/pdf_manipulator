# PR Checks — conventional-commit title, promotion chain, changelog-version
# sanity (both lanes), and workflow + shell lint, all via the shared reusable
# workflow. The one pdf-specific gate stays local: pin-availability HEADs this
# repo's OWN pinned assets (binaryen) — the shared pins live in whuppi/ci and
# are checked by its self-check.
name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, prod]
  workflow_dispatch:

permissions: {}

# One in-flight run per PR; new pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read  # the reusable jobs only checkout + lint, read-only
    uses: whuppi/ci/.github/workflows/pr-checks.yml@v1.0.6

  # Runs on PR activity (not just the daily cron, which GitHub disables after
  # ~60 idle days): HEADs every locally-pinned asset so a pruned pin fails the
  # PR that sits on it, before it fail-closes a build.
  pin-availability:
    name: Pin availability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # checkout only; HEADs the pinned asset URLs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Pinned assets still reachable
        shell: bash
        run: bash tool/ci/upgrade.sh check-availability
