# Full 6-platform test — maintainer adds "ready-to-test" label to trigger.
# Label is auto-removed on new pushes (stale results = wasted compute).
# All build/test logic lives in the Makefile. CI only provisions the environment.
name: Full Test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [prod, dev]

concurrency:
  group: full-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revoke-label:
    name: Revoke stale label
    if: >-
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'ready-to-test')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove ready-to-test label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --remove-label "ready-to-test"
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "Label \`ready-to-test\` removed — new commits pushed. Re-add the label when ready for full test."

  macos:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - name: Install fvm + project SDK
        run: dart pub global activate fvm && fvm install
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - run: echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV && echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - run: make test-ops-native

  linux:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - name: Install fvm + project SDK
        run: dart pub global activate fvm && fvm install
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - run: echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV && echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - run: make test-ops-native

  windows:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Install fvm + project SDK
        shell: bash
        run: dart pub global activate fvm && fvm install
      - uses: dtolnay/rust-toolchain@stable
      - run: make test-ops-native
        shell: bash

  web:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - name: Install fvm + project SDK
        run: dart pub global activate fvm && fvm install
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: browser-actions/setup-chrome@v1
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli
      - run: make build-wasm
      - run: make test-ops-web

  android:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - name: Install fvm + project SDK
        run: dart pub global activate fvm && fvm install
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: make test-ops-native

  ios:
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
      - name: Install fvm + project SDK
        run: dart pub global activate fvm && fvm install
      - uses: dtolnay/rust-toolchain@stable
      - run: make test-ops-native

  gate:
    name: Full Test Gate
    if: always()
    needs: [macos, linux, windows, android, ios, web]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ github.event.action }}" != "labeled" ]] || [[ "${{ github.event.label.name }}" != "ready-to-test" ]]; then
            echo "Full test not triggered — gate passes"
            exit 0
          fi
          RESULTS=("${{ needs.macos.result }}" "${{ needs.linux.result }}" "${{ needs.windows.result }}" "${{ needs.android.result }}" "${{ needs.ios.result }}" "${{ needs.web.result }}")
          for r in "${RESULTS[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "FAILED: platform test returned '$r'"
              exit 1
            fi
          done
          echo "All 6 platforms passed"
