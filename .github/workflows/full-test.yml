# Full test — maintainer adds "ready-to-test" label to trigger.
# Label auto-removed on new pushes (stale results = wasted compute).
#
# Two matrices: default (one runner per target) and all-runners
# (every valid runner combo). Each row declares capabilities —
# make-target provisions them.
#
# Runners: per-row in matrix (target-specific). Gate job uses
# configurable infra runner (default: ubuntu-latest).
name: Full Test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [prod, dev]
  workflow_dispatch:
    inputs:
      all-runners:
        description: "Test every valid runner per target"
        type: boolean
        default: true
      runner:
        description: "Runner for infra jobs (gate)"
        type: choice
        options: [ubuntu-latest, macos-14, windows-latest]
        default: ubuntu-latest

concurrency:
  group: full-test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DEFAULT_RUNNER: ubuntu-latest
  DEFAULT_ALL_RUNNERS: 'true'

jobs:
  inputs:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      all-runners: ${{ steps.resolve.outputs.all-runners }}
    steps:
      - id: resolve
        run: |
          echo "runner=${{ inputs.runner || env.DEFAULT_RUNNER }}" >> $GITHUB_OUTPUT
          echo "all-runners=${{ inputs.all-runners || env.DEFAULT_ALL_RUNNERS }}" >> $GITHUB_OUTPUT

  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'ready-to-test')
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Package tests ──
          - { name: "pkg: macOS",      runner: macos-14,       make: test-pkg-native,      timeout: 30 }
          - { name: "pkg: Linux",      runner: ubuntu-latest,  make: test-pkg-native,      timeout: 30 }
          - { name: "pkg: Windows",    runner: windows-latest, make: test-pkg-native,      timeout: 40 }
          - { name: "pkg: Web",        runner: ubuntu-latest,  make: test-ops-web,         timeout: 40, chrome: true, headless-display: true, wasm-cache: true, wasm-build: true }

          # ── Integration tests ──
          - { name: "int: macOS",      runner: macos-14,       make: test-example-macos,   timeout: 30, xcode-cache: true, xcode-cache-target: macos }
          - { name: "int: Linux",      runner: ubuntu-latest,  make: test-example-linux,   timeout: 30, headless-display: true }
          - { name: "int: Windows",    runner: windows-latest, make: test-example-windows,  timeout: 40 }
          - { name: "int: Android",    runner: ubuntu-latest,  make: test-example-android,  timeout: 40, java: true, hw-accel: true, gradle-cache: true, emulator: true }
          - { name: "int: iOS",        runner: macos-14,       make: test-example-ios,      timeout: 60, xcode-cache: true, xcode-cache-target: ios, pods-cache: true, simulator: true }
          - { name: "int: Web",        runner: ubuntu-latest,  make: test-example-web,      timeout: 40, chrome: true, headless-display: true, wasm-cache: true, wasm-build: true }

          # ── Verify (release builds) ──
          - { name: "verify: Android", runner: ubuntu-latest,  make: verify-android,       timeout: 40, java: true, gradle-cache: true }
          - { name: "verify: iOS",     runner: macos-14,       make: verify-ios,           timeout: 40, xcode-cache: true, xcode-cache-target: ios, pods-cache: true }
          - { name: "verify: macOS",   runner: macos-14,       make: verify-macos,         timeout: 40, xcode-cache: true, xcode-cache-target: macos }
          - { name: "verify: Linux",   runner: ubuntu-latest,  make: verify-linux,         timeout: 30 }
          - { name: "verify: Windows", runner: windows-latest, make: verify-windows,       timeout: 40 }
          - { name: "verify: Web",     runner: ubuntu-latest,  make: verify-web,           timeout: 40, wasm-cache: true, wasm-build: true }

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/make-target
        with:
          make-target: ${{ matrix.make }}
          java: ${{ matrix.java || 'false' }}
          chrome: ${{ matrix.chrome || 'false' }}
          headless-display: ${{ matrix.headless-display || 'false' }}
          hw-accel: ${{ matrix.hw-accel || 'false' }}
          gradle-cache: ${{ matrix.gradle-cache || 'false' }}
          xcode-cache: ${{ matrix.xcode-cache || 'false' }}
          xcode-cache-target: ${{ matrix.xcode-cache-target || '' }}
          pods-cache: ${{ matrix.pods-cache || 'false' }}
          wasm-cache: ${{ matrix.wasm-cache || 'false' }}
          wasm-build: ${{ matrix.wasm-build || 'false' }}
          emulator: ${{ matrix.emulator || 'false' }}
          simulator: ${{ matrix.simulator || 'false' }}

  # ── All-runners ──
  test-all-runners:
    needs: inputs
    if: >-
      needs.inputs.outputs.all-runners == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android on other runners
          - { name: "verify: Android (macos)", runner: macos-14,       make: verify-android, timeout: 40, java: true, gradle-cache: true }
          - { name: "verify: Android (win)",   runner: windows-latest, make: verify-android, timeout: 60, java: true, gradle-cache: true }
          - { name: "int: Android (macos)",    runner: macos-14,       make: test-example-android, timeout: 40, java: true, hw-accel: true, gradle-cache: true, emulator: true }
          # Web on other runners
          - { name: "pkg: Web (macos)",        runner: macos-14,       make: test-ops-web,    timeout: 40, chrome: true, wasm-cache: true, wasm-build: true }
          - { name: "pkg: Web (win)",          runner: windows-latest, make: test-ops-web,    timeout: 40, chrome: true, wasm-cache: true, wasm-build: true }
          - { name: "int: Web (macos)",        runner: macos-14,       make: test-example-web, timeout: 40, chrome: true, wasm-cache: true, wasm-build: true }
          - { name: "int: Web (win)",          runner: windows-latest, make: test-example-web, timeout: 40, chrome: true, wasm-cache: true, wasm-build: true }
          - { name: "verify: Web (macos)",     runner: macos-14,       make: verify-web,      timeout: 40, wasm-cache: true, wasm-build: true }
          - { name: "verify: Web (win)",       runner: windows-latest, make: verify-web,      timeout: 40, wasm-cache: true, wasm-build: true }

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/make-target
        with:
          make-target: ${{ matrix.make }}
          java: ${{ matrix.java || 'false' }}
          chrome: ${{ matrix.chrome || 'false' }}
          headless-display: ${{ matrix.headless-display || 'false' }}
          hw-accel: ${{ matrix.hw-accel || 'false' }}
          gradle-cache: ${{ matrix.gradle-cache || 'false' }}
          xcode-cache: ${{ matrix.xcode-cache || 'false' }}
          xcode-cache-target: ${{ matrix.xcode-cache-target || '' }}
          pods-cache: ${{ matrix.pods-cache || 'false' }}
          wasm-cache: ${{ matrix.wasm-cache || 'false' }}
          wasm-build: ${{ matrix.wasm-build || 'false' }}
          emulator: ${{ matrix.emulator || 'false' }}
          simulator: ${{ matrix.simulator || 'false' }}

  # ── Gate ──
  gate:
    name: Full Test Gate
    if: always()
    needs: [inputs, test, test-all-runners]
    runs-on: ${{ needs.inputs.outputs.runner }}
    steps:
      - name: Evaluate
        run: |
          TEST="${{ needs.test.result }}"
          ALL="${{ needs.test-all-runners.result }}"
          if [[ "$TEST" != "success" && "$TEST" != "skipped" ]]; then
            echo "FAILED: test returned '$TEST'"
            exit 1
          fi
          if [[ "$ALL" != "success" && "$ALL" != "skipped" ]]; then
            echo "FAILED: test-all-runners returned '$ALL'"
            exit 1
          fi
          echo "All jobs passed"
