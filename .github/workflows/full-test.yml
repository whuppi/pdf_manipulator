# Full Test — repo owner triggers manually. Tests all 5 platforms.
# External contributors cannot trigger (requires write access).
name: Full Test

on:
  workflow_dispatch:

concurrency:
  group: full-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: vendor/pdf_oxide }
      - run: dart pub get --no-example
      - run: dart test --timeout=120s

  test-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: vendor/pdf_oxide }
      - run: dart pub get --no-example
      - run: dart test --timeout=120s

  test-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: vendor/pdf_oxide }
      - run: dart pub get --no-example
      - run: dart test --timeout=120s

  test-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: vendor/pdf_oxide }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            cd example
            flutter pub get
            flutter test integration_test/pdf_smoke_test.dart

  test-ios:
    name: iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: vendor/pdf_oxide }
      - uses: futureware-tech/simulator-action@v4
        with: { model: 'iPhone 16' }
      - run: |
          cd example
          flutter pub get
          DEVICE=$(xcrun simctl list devices booted -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(u for r in d.values() for u in r if u['state']=='Booted')['udid'])")
          flutter test integration_test/pdf_smoke_test.dart -d "$DEVICE"
