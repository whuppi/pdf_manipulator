# Full test — maintainer adds "ready-to-test" label to trigger.
# Label auto-removed on new pushes (stale results = wasted compute).
#
# Package tests: unit + native ops on macOS/Linux/Windows + web (3 modes)
# Integration tests: example app on macOS/Android emulator/iOS simulator + web (3 modes)
# Release-build tests: flutter build --release on all 6 targets
#
# Every job composes reusable actions from .github/actions/.
name: Full Test

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [prod, dev]

concurrency:
  group: full-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Package tests (dart test) ──────────────────────────────────────

  pkg-macos:
    name: "pkg: macOS"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/pkg-test-native

  pkg-linux:
    name: "pkg: Linux"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/pkg-test-native

  pkg-windows:
    name: "pkg: Windows"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/pkg-test-native

  pkg-web:
    name: "pkg: Web (3 modes)"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/pkg-test-web

  # ── Integration tests (flutter test on device) ─────────────────────

  int-macos:
    name: "integration: macOS"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/integration-macos

  int-linux:
    name: "integration: Linux"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/integration-linux

  int-windows:
    name: "integration: Windows"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/integration-windows

  int-android:
    name: "integration: Android"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/integration-android

  int-ios:
    name: "integration: iOS"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/integration-ios

  int-web:
    name: "integration: Web (3 modes)"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/integration-web

  # ── Release-build tests ──────────────────────────────────────────
  # Debug and release builds exercise different code paths in the
  # build hook. These verify the hook works in release mode too.

  release-android:
    name: "release: Android (${{ matrix.os }})"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-fvm
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: make test-release-android

  release-ios:
    name: "release: iOS"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-fvm
      - uses: ./.github/actions/setup-rust
        with: { targets: "aarch64-apple-ios,aarch64-apple-ios-sim" }
      - run: make test-release-ios

  release-macos:
    name: "release: macOS"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-fvm
      - uses: ./.github/actions/setup-rust
      - run: make test-release-macos

  release-linux:
    name: "release: Linux"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-fvm
      - uses: ./.github/actions/setup-rust
      - name: Install Linux desktop deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: make test-release-linux

  release-windows:
    name: "release: Windows"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-fvm
      - uses: ./.github/actions/setup-rust
      - run: make test-release-windows

  release-web:
    name: "release: Web (${{ matrix.os }})"
    if: github.event.action == 'labeled' && github.event.label.name == 'ready-to-test'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive }
      - uses: ./.github/actions/setup-fvm
      - uses: ./.github/actions/setup-rust
        with: { targets: wasm32-unknown-unknown }
      - name: Install binaryen (wasm-opt)
        shell: bash
        run: |
          if [[ "$(uname)" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y binaryen
          elif [[ "$(uname)" == "Darwin" ]]; then
            brew install binaryen
          else
            choco install binaryen -y
          fi
      - run: make test-release-web

  # ── Gate ───────────────────────────────────────────────────────────

  gate:
    name: Full Test Gate
    if: always()
    needs: [pkg-macos, pkg-linux, pkg-windows, pkg-web, int-macos, int-linux, int-windows, int-android, int-ios, int-web, release-android, release-ios, release-macos, release-linux, release-windows, release-web]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          if [[ "${{ github.event.action }}" != "labeled" ]] || [[ "${{ github.event.label.name }}" != "ready-to-test" ]]; then
            echo "Full test not triggered — gate passes"
            exit 0
          fi
          RESULTS=(
            "${{ needs.pkg-macos.result }}"
            "${{ needs.pkg-linux.result }}"
            "${{ needs.pkg-windows.result }}"
            "${{ needs.pkg-web.result }}"
            "${{ needs.int-macos.result }}"
            "${{ needs.int-linux.result }}"
            "${{ needs.int-windows.result }}"
            "${{ needs.int-android.result }}"
            "${{ needs.int-ios.result }}"
            "${{ needs.int-web.result }}"
            "${{ needs.release-android.result }}"
            "${{ needs.release-ios.result }}"
            "${{ needs.release-macos.result }}"
            "${{ needs.release-linux.result }}"
            "${{ needs.release-windows.result }}"
            "${{ needs.release-web.result }}"
          )
          for r in "${RESULTS[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "FAILED: a test returned '$r'"
              exit 1
            fi
          done
          echo "All jobs passed"
# CI fixes
