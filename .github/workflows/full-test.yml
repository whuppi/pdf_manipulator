name: Full Test

on:
  workflow_dispatch:

concurrency:
  group: full-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: ./.github/actions/dart-test
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/dart-test
  windows:
    runs-on: windows-latest
    steps:
      - uses: ./.github/actions/dart-test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/android-test
  ios:
    runs-on: macos-14
    steps:
      - uses: ./.github/actions/ios-test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/web-test
