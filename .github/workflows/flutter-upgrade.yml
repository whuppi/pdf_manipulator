# Check for new Flutter stable releases daily.
# If newer than our pin, open (or update) a single upgrade PR.
# CI runs basic checks automatically; full-test only on ready-to-test label.
name: Flutter Upgrade Check

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 8am UTC
  workflow_dispatch: {}    # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Check for new Flutter stable
        id: check
        run: |
          CURRENT=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")
          LATEST=$(curl -sS https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          stable = [r for r in data['releases'] if r['channel'] == 'stable']
          stable.sort(key=lambda r: r['release_date'], reverse=True)
          print(stable[0]['version'])
          ")

          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "needs_upgrade=false" >> $GITHUB_OUTPUT
            echo "✓ Already on latest stable: $CURRENT"
          else
            echo "needs_upgrade=true" >> $GITHUB_OUTPUT
            echo "⬆ New stable: $CURRENT → $LATEST"
          fi

      - name: Create or update upgrade PR
        if: steps.check.outputs.needs_upgrade == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          BRANCH="chore/flutter-upgrade"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if an upgrade PR already exists (any version)
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number,title --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            # PR exists — check what version it targets
            EXISTING_VER=$(gh pr view "$EXISTING_PR" --json body --jq '.body' \
              | grep -oP 'New \| `\K[^`]+' || echo "unknown")

            if [ "$EXISTING_VER" = "$LATEST" ]; then
              echo "✓ PR #$EXISTING_PR already targets $LATEST — nothing to do"
              exit 0
            fi

            echo "⬆ Updating PR #$EXISTING_PR from $EXISTING_VER → $LATEST"

            # Fetch and update the existing branch
            git fetch origin "$BRANCH" 2>/dev/null || true
            git checkout -B "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout -b "$BRANCH"
          else
            echo "✚ Creating new upgrade branch"
            git checkout -b "$BRANCH"
          fi

          # Update .fvmrc
          python3 -c "
          import json
          with open('.fvmrc') as f: data = json.load(f)
          data['flutter'] = '$LATEST'
          with open('.fvmrc', 'w') as f: json.dump(data, f, indent=2); f.write('\n')
          "

          git add .fvmrc
          git commit -m "chore: bump Flutter $CURRENT → $LATEST" || {
            echo "Nothing to commit — .fvmrc already at $LATEST"
            exit 0
          }
          git push origin "$BRANCH" --force-with-lease

          # Create PR if it doesn't exist yet
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base dev \
              --head "$BRANCH" \
              --title "chore: bump Flutter $CURRENT → $LATEST" \
              --body "$(cat <<EOF
          New Flutter stable release detected.

          | | Version |
          |---|---|
          | Current | \`$CURRENT\` |
          | New | \`$LATEST\` |

          **What to do:**
          - CI runs basic checks (analyze + native test) automatically
          - Add \`ready-to-test\` label for full cross-platform test
          - Green → merge. Red → pull branch, fix, push.

          _Auto-generated by flutter-upgrade.yml_
          EOF
          )"
          else
            # Update existing PR title and body
            gh pr edit "$EXISTING_PR" \
              --title "chore: bump Flutter $CURRENT → $LATEST" \
              --body "$(cat <<EOF
          New Flutter stable release detected.

          | | Version |
          |---|---|
          | Current | \`$CURRENT\` |
          | New | \`$LATEST\` |

          **What to do:**
          - CI runs basic checks (analyze + native test) automatically
          - Add \`ready-to-test\` label for full cross-platform test
          - Green → merge. Red → pull branch, fix, push.

          _Auto-generated by flutter-upgrade.yml (updated from previous version)_
          EOF
          )"
            echo "✓ Updated PR #$EXISTING_PR"
          fi
