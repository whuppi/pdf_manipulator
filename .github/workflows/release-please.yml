# Auto-creates Release PRs from conventional commits on main.
# Zero compute — just reads git history and opens/updates a PR.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: dart
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
