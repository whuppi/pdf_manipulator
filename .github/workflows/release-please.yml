# Auto-creates Release PRs from conventional commits.
# dev branch → prerelease versions (1.1.0-dev.0)
# main branch → stable versions (1.1.0)
# Zero compute — just reads git history and opens/updates a PR.
name: Release Please

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: dart
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          prerelease: ${{ github.ref_name == 'dev' }}
