name: 'Load Config'
description: 'Reads config.json — single source of truth for all tool versions.'

outputs:
  flutter_channel:
    description: 'Flutter channel (stable/beta)'
    value: ${{ steps.read.outputs.flutter_channel }}
  rust_version:
    description: 'Rust toolchain version'
    value: ${{ steps.read.outputs.rust_version }}
  rust_features:
    description: 'Cargo features for pdf_oxide'
    value: ${{ steps.read.outputs.rust_features }}
  wasm_pack_version:
    description: 'wasm-pack version'
    value: ${{ steps.read.outputs.wasm_pack_version }}
  wasm_bindgen_version:
    description: 'wasm-bindgen-cli version'
    value: ${{ steps.read.outputs.wasm_bindgen_version }}

runs:
  using: "composite"
  steps:
    - name: Read config.json
      id: read
      shell: bash
      run: |
        CONFIG="${{ github.workspace }}/.github/workflows/config.json"
        echo "flutter_channel=$(jq -r '.flutter.channel' $CONFIG)" >> $GITHUB_OUTPUT
        echo "rust_version=$(jq -r '.rust.version' $CONFIG)" >> $GITHUB_OUTPUT
        echo "rust_features=$(jq -r '.rust.features' $CONFIG)" >> $GITHUB_OUTPUT
        echo "wasm_pack_version=$(jq -r '.rust.wasm_pack_version' $CONFIG)" >> $GITHUB_OUTPUT
        echo "wasm_bindgen_version=$(jq -r '.rust.wasm_bindgen_version' $CONFIG)" >> $GITHUB_OUTPUT
