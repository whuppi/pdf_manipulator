# ────────────────────────────────────────────────────────────────────
# debug-ssh.yml — Raw SSH into CI runner via reverse SSH tunnel.
#
# Starts sshd, creates a reverse tunnel through a relay, prints
# connection string. Raw shell, no tmux, no tmate.
#
# Usage:
#   gh workflow run debug-ssh.yml
# ────────────────────────────────────────────────────────────────────

name: Debug SSH

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner OS"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-14
          - windows-latest
        default: ubuntu-latest

jobs:
  debug:
    name: "SSH: ${{ inputs.runner }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup SSH server and tunnel
        run: |
          set -euo pipefail

          # ── Install and configure sshd ──────────────────────────
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server

          # Add DC's public SSH key for authentication
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          curl -sS https://github.com/chaudharydeepanshu.keys >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          echo "Authorized keys:"
          cat ~/.ssh/authorized_keys

          # Configure sshd
          sudo mkdir -p /run/sshd
          sudo tee /etc/ssh/sshd_config.d/debug.conf > /dev/null <<SSHEOF
          Port 2222
          PasswordAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          AllowTcpForwarding yes
          X11Forwarding no
          SSHEOF

          sudo /usr/sbin/sshd -p 2222
          echo "sshd running on port 2222"

          # ── Create reverse tunnel via bore.pub (free, no signup) ─
          # bore.pub is a free TCP tunnel relay — like ngrok but no account needed
          curl -sSL https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          chmod +x bore

          # Start bore tunnel in background — forwards remote port to local 2222
          ./bore local 2222 --to bore.pub &
          BORE_PID=$!
          sleep 3

          # bore prints the assigned port to stdout
          echo ""
          echo "============================================"
          echo "  SSH INTO THIS RUNNER:"
          echo ""
          echo "  ssh -p <PORT> runner@bore.pub"
          echo ""
          echo "  (check the bore output above for the port)"
          echo "============================================"
          echo ""

          # Keep alive for 5 hours
          echo "Session will stay open for 5 hours. To end early: touch /tmp/stop"
          for i in $(seq 1 1800); do
            if [ -f /tmp/stop ]; then
              echo "Stop file found, ending session"
              break
            fi
            sleep 10
          done

          kill $BORE_PID 2>/dev/null || true
