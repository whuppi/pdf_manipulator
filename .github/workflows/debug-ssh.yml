# ────────────────────────────────────────────────────────────────────
# debug-ssh.yml — Debug CI on any runner with SSH + automatic test.
#
# Two modes:
#   1. SSH mode (default): opens tmate session for interactive access
#   2. Run mode: executes a command and dumps output (no SSH needed)
#
# Trigger: workflow_dispatch only (manual).
#
# Usage:
#   # Interactive SSH session:
#   gh workflow run debug-ssh.yml -f runner=ubuntu-latest -f setup=web
#
#   # Run a specific command (no SSH, just see output in logs):
#   gh workflow run debug-ssh.yml -f setup=web -f run="xvfb-run make test-example-web-jspi"
#
#   # Run with SSH afterwards (debug failures interactively):
#   gh workflow run debug-ssh.yml -f setup=web -f run="xvfb-run make test-example-web-jspi" -f ssh_after=true
# ────────────────────────────────────────────────────────────────────

name: Debug SSH

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner OS"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-14
          - windows-latest
        default: ubuntu-latest

      setup:
        description: "Pre-install environment"
        required: true
        type: choice
        options:
          - none
          - web
          - rust
          - flutter
          - full
        default: web

      run:
        description: "Command to run (empty = SSH only)"
        required: false
        type: string
        default: ""

      ssh_after:
        description: "Open SSH after command finishes/fails"
        required: false
        type: boolean
        default: false

      timeout:
        description: "Session timeout in minutes"
        required: false
        type: number
        default: 30

      branch:
        description: "Branch to checkout"
        required: false
        type: string
        default: ""

jobs:
  debug:
    name: "Debug: ${{ inputs.runner }} (${{ inputs.setup }})"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive

      - name: Setup Flutter
        if: contains(fromJSON('["web","flutter","full"]'), inputs.setup)
        uses: ./.github/actions/setup-fvm

      - name: Setup Rust
        if: contains(fromJSON('["rust","full"]'), inputs.setup)
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Web Testing
        if: inputs.setup == 'web' || inputs.setup == 'full'
        uses: ./.github/actions/setup-web-testing

      - name: Setup example web assets
        if: inputs.setup == 'web' || inputs.setup == 'full'
        run: |
          rm -rf example/web/pdf_manipulator
          cd example
          fvm flutter pub get
          fvm flutter pub run pdf_manipulator:setup --force

      - name: Environment info
        run: |
          echo "::group::System"
          uname -a
          df -h / /dev/shm 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Tools"
          flutter --version 2>/dev/null | head -2 || true
          google-chrome-stable --version 2>/dev/null || true
          chromedriver --version 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Web assets"
          ls -lh example/web/pdf_manipulator/ 2>/dev/null || echo "not set up"
          echo "::endgroup::"

      # ── Run command (if provided) ─────────────────────────────────
      - name: "Run: ${{ inputs.run }}"
        if: inputs.run != ''
        id: run_cmd
        continue-on-error: true
        run: ${{ inputs.run }}

      - name: Report result
        if: inputs.run != ''
        run: |
          if [ "${{ steps.run_cmd.outcome }}" = "success" ]; then
            echo "✅ Command succeeded"
          else
            echo "❌ Command failed"
          fi

      # ── SSH session (if no command, or ssh_after=true) ────────────
      - name: "SSH session"
        if: inputs.run == '' || inputs.ssh_after == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
        timeout-minutes: ${{ fromJSON(inputs.timeout) }}
