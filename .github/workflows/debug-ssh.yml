# ────────────────────────────────────────────────────────────────────
# debug-ssh.yml — Raw SSH into CI runner via bore tunnel.
# ────────────────────────────────────────────────────────────────────

name: Debug SSH

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner OS"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-14
          - windows-latest
        default: ubuntu-latest

jobs:
  debug:
    name: "SSH: ${{ inputs.runner }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start sshd + bore tunnel
        run: |
          set -euo pipefail

          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          curl -sS https://github.com/chaudharydeepanshu.keys >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          sudo mkdir -p /run/sshd
          echo -e "Port 2222\nPasswordAuthentication no\nPubkeyAuthentication yes\nPermitRootLogin no" \
            | sudo tee /etc/ssh/sshd_config.d/debug.conf >/dev/null
          sudo /usr/sbin/sshd -p 2222

          curl -sSL "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          chmod +x /tmp/bore

          /tmp/bore local 2222 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 5

          BORE_PORT=$(grep -oP 'bore\.pub:\K\d+' /tmp/bore.log | head -1 || true)
          if [ -n "$BORE_PORT" ]; then
            echo "::notice::SSH ready: ssh -p $BORE_PORT -o StrictHostKeyChecking=no runner@bore.pub"
          else
            echo "::error::bore tunnel failed"
            cat /tmp/bore.log
            exit 1
          fi

      - name: Keep alive (touch /tmp/stop to end)
        run: |
          echo "Session open for 5 hours. Touch /tmp/stop to end early."
          while [ ! -f /tmp/stop ]; do sleep 10; done
