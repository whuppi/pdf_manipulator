# ────────────────────────────────────────────────────────────────────
# debug-ssh.yml — SSH into any runner for interactive debugging.
#
# Uses the debug-ssh composite action (bore tunnel, key-only auth).
# Blocking mode — keeps the runner alive until /tmp/stop is touched.
#
# Usage:
#   gh workflow run debug-ssh.yml
#   gh workflow run debug-ssh.yml -f runner=macos-14
# ────────────────────────────────────────────────────────────────────

name: Debug SSH

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner OS"
        required: true
        type: choice
        options:
          - ubuntu-24.04
          - macos-14
          - windows-2025-vs2026
        default: ubuntu-24.04

permissions: {}

# Manual debug runs — let each ref's run stand, don't cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEFAULT_RUNNER: ubuntu-24.04

jobs:
  # Hand-runnable (workflow_dispatch) — supports runner selection.
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        shell: bash
        env:
          OVERRIDE: ${{ inputs.runner }}
          DEFAULT: ${{ env.DEFAULT_RUNNER }}
        run: echo "runner=${OVERRIDE:-$DEFAULT}" >> "$GITHUB_OUTPUT"

  debug:
    name: "SSH: ${{ needs.inputs.outputs.runner }}"
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 300
    permissions:
      contents: read  # checkout only; the SSH tunnel needs no token scope

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - uses: whuppi/ci/actions/debug-ssh@v2.0.5

      - name: Keep alive (touch /tmp/stop to end)
        shell: bash
        run: |
          echo "SSH session open. Touch /tmp/stop to end."
          while [ ! -f /tmp/stop ]; do sleep 10; done
