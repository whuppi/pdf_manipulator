# ────────────────────────────────────────────────────────────────────
# debug-ssh.yml — Raw SSH into CI runner. No tmate, no tmux.
#
# Starts sshd with key-only auth (your GitHub SSH keys), creates a
# reverse tunnel via serveo.net, prints connection string.
#
# Security: key-only auth, no password, no root login. Public keys
# fetched from GitHub (already public). Tunnel is SSH-encrypted.
#
# Usage:
#   gh workflow run debug-ssh.yml
# ────────────────────────────────────────────────────────────────────

name: Debug SSH

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner OS"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-14
          - windows-latest
        default: ubuntu-latest

jobs:
  debug:
    name: "SSH: ${{ inputs.runner }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start SSH server and tunnel
        run: |
          set -euo pipefail

          # ── sshd with key-only auth ─────────────────────────────
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          curl -sS https://github.com/chaudharydeepanshu.keys >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          sudo mkdir -p /run/sshd
          cat <<CONF | sudo tee /etc/ssh/sshd_config.d/debug.conf >/dev/null
          Port 2222
          PasswordAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          CONF
          sudo /usr/sbin/sshd -p 2222
          echo "sshd running on port 2222"

          # ── Reverse tunnel via serveo.net ────────────────────────
          # No signup, no binary download. Pure SSH reverse tunnel.
          ssh-keygen -t ed25519 -f ~/.ssh/tunnel_key -N "" -q
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            -i ~/.ssh/tunnel_key \
            -R 0:localhost:2222 serveo.net 2>&1 | tee /tmp/serveo.log &
          TUNNEL_PID=$!

          # Wait for serveo to print the forwarding line
          for i in $(seq 1 30); do
            if grep -q 'Forwarding' /tmp/serveo.log 2>/dev/null; then
              break
            fi
            sleep 2
          done

          echo ""
          echo "============================================"
          echo "  CONNECT WITH:"
          echo ""
          grep 'Forwarding' /tmp/serveo.log || echo "  (check Actions log for serveo output)"
          echo ""
          echo "  Key-only auth — uses your GitHub SSH keys"
          echo "  Username: runner"
          echo "============================================"
          echo ""

          # Keep alive
          echo "Touch /tmp/stop to end session early"
          while [ ! -f /tmp/stop ]; do
            if ! kill -0 $TUNNEL_PID 2>/dev/null; then
              echo "Tunnel died, restarting..."
              ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
                -i ~/.ssh/tunnel_key \
                -R 0:localhost:2222 serveo.net 2>&1 | tee /tmp/serveo.log &
              TUNNEL_PID=$!
              sleep 5
            fi
            sleep 10
          done
