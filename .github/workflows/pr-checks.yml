# PR Checks — conventional-commit title, promotion chain, changelog-version
# sanity (both lanes), and workflow + shell lint, all via the shared reusable
# workflow. The one pdf-specific gate stays local: pin-availability HEADs this
# repo's OWN pins — the shared pins live in whuppi/ci and
# are checked by its self-check.
name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, prod]
  workflow_dispatch:

permissions: {}

# One in-flight run per PR; new pushes cancel the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read  # the reusable jobs only checkout + lint, read-only
    uses: whuppi/ci/.github/workflows/pr-checks.yml@v2.7.0

  # Runs on PR activity (not just the daily cron, which GitHub disables after
  # ~60 idle days): HEADs every locally-pinned asset so a pruned pin fails the
  # PR that sits on it, before it fail-closes a build.
  pin-availability:
    name: Pin availability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # checkout only; HEADs the pinned asset URLs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned assets still reachable
        shell: bash
        run: bash tool/ci/upgrade.sh check-availability
      # The vendored make-target fork pins whuppi/ci capabilities separately
      # from the workflows and dependabot's whuppi-ci group does NOT reach
      # inside it — so it has drifted (v1.0.1 vs v1.0.4) before. Fail the PR if
      # any whuppi/ci ref across .github is on a different version than the rest.
      - name: whuppi/ci refs share one version
        shell: bash
        run: |
          v=$(grep -rhoE 'whuppi/ci/[^@[:space:]]*@v[0-9.]+' .github | grep -oE 'v[0-9.]+' | sort -u | tr '\n' ' ')
          if [ "$(printf '%s' "$v" | wc -w)" -gt 1 ]; then
            echo "::error::whuppi/ci refs span multiple versions: $v"
            exit 1
          fi
          echo "whuppi/ci refs all on: $v"
