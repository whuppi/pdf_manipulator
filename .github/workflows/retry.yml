# Auto-retry — re-runs the failed jobs of a CI / Full Test run once, absorbing
# transient runner infra blips. Delegates to the shared reusable workflow.
#
# ── PRIVILEGED REACTIVE WORKFLOW ─────────────────────────────────────
# workflow_run is GitHub's only mechanism to react to another run's completion.
# zizmor flags it categorically. The reusable workflow is hardened to every item
# of the workflow-security doctrine — no checkout, no artifact ingestion, the
# only fork-influenced value is the numeric run id handed to `gh run rerun`,
# least-privilege actions:write, owner-guarded, and run_attempt==1 so it fires
# at most once. The ignore below is only safe while all of that holds.
name: Auto-retry

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, Full Test]
    types: [completed]

permissions: {}

# One retry per completed run — never cancel an in-flight retry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    permissions:
      actions: write  # gh run rerun re-runs the failed jobs of the run
    uses: whuppi/ci/.github/workflows/retry.yml@v2.0.3
