# Auto-retry — re-runs the failed jobs of a CI / Full Test run once.
#
# The test matrix is large and the GitHub-hosted runners blip on infra
# every run (crates.io DNS, cache reserve, emulator boot, apt). A single
# transient failure shouldn't need a manual re-run. This fires after a
# run completes; if it failed on its FIRST attempt, it re-runs only the
# failed jobs (gh run rerun --failed). The run_attempt == 1 guard means
# exactly one auto-retry — a genuine failure still fails on attempt 2,
# so real breakage is never hidden, only infra blips are absorbed.
#
# No PR comment needed: GitHub already notifies on the failed attempt,
# and the run's attempt counter shows a retry happened.
name: Auto-retry

on:
  workflow_run:
    workflows: [CI, Full Test]
    types: [completed]

permissions:
  actions: write # re-run failed jobs

jobs:
  retry:
    # Only when the run failed on its first attempt.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
        run: |
          echo "Re-running failed jobs of '$RUN_NAME' (run $RUN_ID, attempt 1)."
          gh run rerun "$RUN_ID" --repo "${{ github.repository }}" --failed
