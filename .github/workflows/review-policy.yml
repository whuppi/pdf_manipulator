# Review Policy — enforces who must approve before merge.
#
# Repo owner PRs: slopfairy must approve. No human needed.
# Everyone else:  slopfairy must approve AND (repo owner OR all
#                 codeowners for every touched path) must approve.
#
# CODEOWNERS is read from the BASE branch (fork-safe).
# The PR author cannot count as their own approver.
name: Review Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  check:
    name: Review Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce review policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.review.pull_request_number || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Resolve PR number from either event type
          if [ -z "$PR" ]; then
            echo "::error::Could not determine PR number"
            exit 1
          fi

          # Get PR metadata
          PR_DATA=$(gh api "repos/$REPO/pulls/$PR")
          AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.base.ref')

          echo "PR #$PR by @$AUTHOR → $BASE_REF"

          # ── Get all reviews (latest per user, excluding author) ────────
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR/reviews" --jq '
            [.[] | {user: .user.login, state: .state}]
            | group_by(.user)
            | map(last)
          ')

          echo "Reviews: $REVIEWS"

          # ── Check 1: slopfairy must approve ────────────────────────────
          SLOPFAIRY_APPROVED=$(echo "$REVIEWS" | jq '[.[] | select(.user == "slopfairy" and .state == "APPROVED")] | length')
          if [ "$SLOPFAIRY_APPROVED" -eq 0 ]; then
            echo "::error::slopfairy has not approved this PR"
            exit 1
          fi
          echo "✓ slopfairy approved"

          # ── Check 2: is the author the repo owner? ────────────────────
          OWNER_ROLE=$(gh api "orgs/${REPO%%/*}/memberships/$AUTHOR" --jq '.role' 2>/dev/null || echo "none")
          REPO_ADMIN="false"
          if [ "$OWNER_ROLE" != "admin" ]; then
            # Also check direct repo admin permission
            PERM=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || echo "none")
            if [ "$PERM" = "admin" ]; then
              REPO_ADMIN="true"
            fi
          else
            REPO_ADMIN="true"
          fi

          if [ "$REPO_ADMIN" = "true" ]; then
            echo "✓ Author is repo owner — only slopfairy approval needed"
            exit 0
          fi

          # ── Check 3: non-owner needs human approval ────────────────────
          # Human = anyone who approved that is NOT slopfairy and NOT the author
          HUMAN_APPROVERS=$(echo "$REVIEWS" | jq --arg author "$AUTHOR" '
            [.[] | select(.state == "APPROVED" and .user != "slopfairy" and .user != $author)]
            | map(.user)
          ')
          HUMAN_COUNT=$(echo "$HUMAN_APPROVERS" | jq 'length')

          # Check if repo owner approved (covers everything)
          OWNER_APPROVED=$(echo "$REVIEWS" | jq '
            [.[] | select(.state == "APPROVED" and .user != "slopfairy")] | map(.user)
          ')
          # We need to check if any approver is an admin
          ADMIN_APPROVED="false"
          for approver in $(echo "$OWNER_APPROVED" | jq -r '.[]'); do
            role=$(gh api "orgs/${REPO%%/*}/memberships/$approver" --jq '.role' 2>/dev/null || echo "none")
            if [ "$role" = "admin" ]; then
              ADMIN_APPROVED="true"
              echo "✓ Repo owner @$approver approved"
              break
            fi
            perm=$(gh api "repos/$REPO/collaborators/$approver/permission" --jq '.permission' 2>/dev/null || echo "none")
            if [ "$perm" = "admin" ]; then
              ADMIN_APPROVED="true"
              echo "✓ Repo admin @$approver approved"
              break
            fi
          done

          if [ "$ADMIN_APPROVED" = "true" ]; then
            echo "✓ Repo owner/admin approved — all paths covered"
            exit 0
          fi

          # ── Check 4: codeowner approval per touched path ───────────────
          # Get CODEOWNERS from base branch
          CODEOWNERS_RAW=$(gh api "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE_REF" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")

          if [ -z "$CODEOWNERS_RAW" ]; then
            echo "::error::No CODEOWNERS file found — non-owner PRs require repo owner approval"
            exit 1
          fi

          # Get changed files
          CHANGED_FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')

          # For each changed file, find matching codeowner and check approval
          MISSING_APPROVALS=""
          CHECKED_TEAMS=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            # Find the matching CODEOWNERS line (last match wins, like .gitignore)
            OWNER_LINE=""
            while IFS= read -r line; do
              line=$(echo "$line" | sed 's/#.*//' | xargs)
              [ -z "$line" ] && continue
              PATTERN=$(echo "$line" | awk '{print $1}')
              # Simple glob match
              if [[ "$file" == $PATTERN ]] || [[ "$file" == ${PATTERN}* ]] || [[ "/$file" == ${PATTERN}* ]]; then
                OWNER_LINE="$line"
              fi
            done <<< "$CODEOWNERS_RAW"

            if [ -z "$OWNER_LINE" ]; then
              continue
            fi

            # Extract owners (everything after the pattern)
            OWNERS=$(echo "$OWNER_LINE" | awk '{$1=""; print}' | xargs)

            # Skip if already checked this owner set
            if echo "$CHECKED_TEAMS" | grep -qF "$OWNERS"; then
              continue
            fi
            CHECKED_TEAMS="$CHECKED_TEAMS|$OWNERS"

            # Check if any of the owners approved
            OWNER_FOUND="false"
            for owner in $OWNERS; do
              owner_name=${owner#@}
              # Check if it's a team (contains /)
              if [[ "$owner_name" == */* ]]; then
                team_slug=${owner_name#*/}
                # Check if any team member approved
                TEAM_MEMBERS=$(gh api "orgs/${REPO%%/*}/teams/$team_slug/members" --jq '.[].login' 2>/dev/null || echo "")
                for member in $TEAM_MEMBERS; do
                  if echo "$HUMAN_APPROVERS" | jq -e --arg m "$member" 'index($m) != null' >/dev/null 2>&1; then
                    OWNER_FOUND="true"
                    break
                  fi
                done
              else
                # Individual user
                if echo "$HUMAN_APPROVERS" | jq -e --arg m "$owner_name" 'index($m) != null' >/dev/null 2>&1; then
                  OWNER_FOUND="true"
                fi
              fi
              [ "$OWNER_FOUND" = "true" ] && break
            done

            if [ "$OWNER_FOUND" != "true" ]; then
              MISSING_APPROVALS="$MISSING_APPROVALS\n  $file → needs approval from $OWNERS"
            fi
          done <<< "$CHANGED_FILES"

          if [ -n "$MISSING_APPROVALS" ]; then
            echo "::error::Missing codeowner approvals:$(echo -e "$MISSING_APPROVALS")"
            echo ""
            echo "Non-owner PRs need approval from the repo owner OR all codeowners for touched paths."
            exit 1
          fi

          echo "✓ All codeowner approvals satisfied"
