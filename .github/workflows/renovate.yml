# Consumer wrapper — calls the shared reusable Renovate runner on this repo, the
# same shape as upgrade-check.yml. Renovate reads renovate.json5, scans workflows
# AND composite action.yml (the dependabot-core#6704 gap), and opens bump PRs.
name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'   # daily
  workflow_dispatch: {}    # manual trigger

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    permissions:
      contents: write        # push bump branches
      pull-requests: write   # open bump PRs
      issues: write          # dependency dashboard
    # @main until the whuppi/ci refs land on v2.2.0; then pin @vX.Y.Z.
    uses: whuppi/ci/.github/workflows/renovate.yml@main
    with:
      dryRun: false
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
