# Version updates only. Security fixes come from this repo's Dependabot alerts +
# automated-security-fixes (enabled in settings), not from this file.
version: 2
updates:
  # pub — the root package and the example app. Grouped so a batch of bumps is
  # a single review PR; prefixed so the title passes the conventional-commit
  # lint (an unprefixed "Bump foo" title fails it).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "dev"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      deps:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  # No github-actions ecosystem here on purpose. EVERY action `uses:` ref —
  # whuppi/ci and third-party, workflows AND composite action.yml — is owned by
  # the single `action-refs` sweep in whuppi/ci's upgrade-check.yml (opt-in via
  # sweepActions). Dependabot can't read composite action.yml (dependabot-core#6704)
  # and splitting action updates workflow-vs-composite splits the pin, which
  # pin-availability rejects — so one owner takes all of it, and Dependabot here
  # owns only pub.
