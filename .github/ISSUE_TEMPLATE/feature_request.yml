name: Feature request
description: Suggest a new capability
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What do you need?
      placeholder: Describe the feature or capability you'd like.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What's your use case?
      placeholder: What problem does this solve? How are you working around it today?
