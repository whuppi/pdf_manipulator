include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - 'lib/src/ffi/native_bindings.g.dart'
    - 'vendor/**'

linter:
  rules:
    # Requires Dart 3.12+ syntax but SDK constraint is >=3.10.0.
    # Enable when minimum SDK is bumped to 3.12.
    use_null_aware_elements: false
