# Public, redistributable PDFs the compression benchmark downloads on demand
# into .corpus/. Every file is pinned by SHA-256: a changed upstream file
# fails the hash check and the bench skips it. Each license was read on the
# page named in license_url.
#
# The incremental-history, self-merged and re-compressed cases are not
# here: bin/bench.dart builds them from these files.

