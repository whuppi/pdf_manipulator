# Test configuration for pdf_manipulator.
#
# Default platform is VM (native tests). Web tests run explicitly:
#   dart test test/bridge/web/ -p chrome
#   dart test test/bridge/web/atomics_test.dart -p chrome-coi
#
# `dart test` with no -p flag runs native tests only (fast, ~8s).

platforms: [vm]

define_platforms:
  chrome-coi:
    name: Chrome with Cross-Origin Isolation
    extends: chrome
    settings:
      arguments: --enable-features=SharedArrayBuffer

tags:
  web:
  atomics:
