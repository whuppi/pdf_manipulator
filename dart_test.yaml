# Default platform is VM (native). Web tests run explicitly with -p chrome.
#
#   dart test                                                    # native only
#   dart test test/ops/web_runner_test.dart -p chrome            # web ops
#   dart test test/transport/web/atomics_test.dart -p chrome-coi # Atomics mode
#
# Or use the Makefile:
#   make test       # native
#   make test-web   # web (Chrome)
#   make check      # analyze + native + web

platforms: [vm]

define_platforms:
  chrome-coi:
    name: Chrome with Cross-Origin Isolation
    extends: chrome
    settings:
      arguments: --enable-features=SharedArrayBuffer
