name: PdfOxideBindings
description: Generated FFI bindings for pdf_oxide C API
output: 'lib/src/ffi/native_bindings.g.dart'
headers:
  entry-points:
    - 'vendor/pdf_oxide/include/pdf_oxide_c/pdf_oxide.h'
preamble: |
  // GENERATED by ffigen from vendor/pdf_oxide/include/pdf_oxide_c/pdf_oxide.h
  // Do not edit. Re-run `dart run ffigen` after bumping vendor/pdf_oxide.
comments:
  style: any
  length: full
ffi-native:
  assetId: 'package:pdf_manipulator/src/ffi/native_bindings.g.dart'
globals:
  exclude:
    - '_.*'
    - '__.*'
macros:
  exclude:
    - '_.*'
    - '__.*'
