name: pdf_manipulator_example_trimmed
description: >-
  The example app under a TRIMMED engine — a configuration shell, not a
  second app. This pubspec IS the entire difference: the trim user_define
  below makes the build hook compile the engine with only the render
  capability (plus core, which is always included). App code comes from
  example/, so the two flavors cannot drift apart. Capabilities outside
  the keep-list answer the typed not-enabled error — the smoke test here
  asserts exactly that contract.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

# THE keep switch — the one pubspec entry a real consumer flips (see the
# package README's "The engine binary" section).
hooks:
  user_defines:
    pdf_manipulator:
      keep: [render]

dependencies:
  flutter:
    sdk: flutter

  pdf_manipulator:
    path: ../

  # The real app — this shell re-exports its main().
  pdf_manipulator_example:
    path: ../example/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
