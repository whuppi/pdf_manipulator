name: pdf_manipulator
version: 1.0.0
description: >
  Cross-platform PDF manipulation. Merge, split, compress, encrypt, decrypt,
  rotate, reorder, watermark, extract text and images — powered by pdf_oxide
  (Rust, MIT), zero main-thread blocking on every platform including web.
homepage: https://github.com/whuppi/pdf_manipulator
repository: https://github.com/whuppi/pdf_manipulator
issue_tracker: https://github.com/whuppi/pdf_manipulator/issues

environment:
  sdk: ">=3.10.0 <4.0.0"

hooks:
  build: true

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.0
  hooks: ^1.0.0
  logging: ^1.3.0
  meta: ^1.16.0
  package_config: ^2.1.0
  web: ^1.1.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.0
  ffigen: ^20.1.1
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  stream_channel: ^2.1.4
